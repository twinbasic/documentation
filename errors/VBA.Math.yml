  Reference/Default/VBA/Math/Round.md:
    rows:
      - error: 5
        when: "*numdecimalplaces* rounds to a negative number"
        cases:
          - Round(1.5, -1)
          - Round(1.5, -0.6)
          - Round(Empty, -1)
          - { decl: Dim C As Currency, setup: C = 1.5, expr: 'Round(C, -1)' }
          - { decl: Dim D As Variant, setup: 'D = CDec("1.5")', expr: 'Round(D, -1)' }
      - error: 5
        when: "*numdecimalplaces* is greater than 22 and *expression* is a **Single**, **Double** or **Date**, or a string"
        cases:
          - Round(1.5, 23)
          - Round(1.5, 2147483647)
          - Round(1.7976931348623157E+308, 300)
          - { decl: Dim S As Single, setup: S = 1.5, expr: 'Round(S, 23)' }
          - { decl: Dim T As Date, setup: 'T = #1/1/2000#', expr: 'Round(T, 23)' }
          - Round("1.5", 23)
      - error: 94
        when: "*numdecimalplaces* is **Null**"
        cases:
          - Round(1.5, Null)
          - Round(Null, Null)
      - error: 0
        when: "*expression* is **Null** and *numdecimalplaces* is negative"
        vb6: 5
        bug: round-null-negative-digits
        cases:
          - Round(Null, -1)
    quiet:
      - Round(Null)
      - Round(Null, 23)
      - Round(Empty)
      - Round("2.5")
      - Round(1.5, 0)
      - Round(1.5, 22)
      - Round(1.5, -0.4)
      - Round(1.5, Empty)
      - Round(1.7976931348623157E+308, 1)
      - { decl: Dim S As Single, setup: S = 1.5, expr: 'Round(S, 22)' }
      - { decl: Dim C As Currency, setup: C = 1.5, expr: 'Round(C, 2147483647)' }
      - { decl: Dim I As Integer, setup: I = 1, expr: 'Round(I, 2147483647)' }
      - { decl: Dim L As Long, setup: L = 1, expr: 'Round(L, 2147483647)' }
      - { decl: Dim D As Variant, setup: 'D = CDec("1.5")', expr: 'Round(D, 2147483647)' }
      - Round(True, 2147483647)
      - Round(Empty, 2147483647)
      - { decl: Dim L As LongLong, setup: L = 9223372036854775807^, expr: 'Round(L, 2147483647)', only: [tb, vba64] }
