# The VBA Math module. Format: WIP.Errors.md.
beta: 1010
pages:
  Reference/Default/VBA/Math/Abs.md:
    rows:
      - error: 6
        when: "*number* is a **Currency** of -922,337,203,685,477.5808"
        cases:
          - { decl: Dim C As Currency, setup: C = -922337203685477.5807@ - 0.0001@, expr: Abs(C) }
          - { decl: Dim V As Variant, setup: V = -922337203685477.5807@ - 0.0001@, expr: Abs(V) }
      - error: 0
        when: "*number* is an **Integer** of -32,768 or a **Long** of -2,147,483,648 (twinBASIC returns a **Long** or a **Double**)"
        vb6: 6
        bug: abs-minimum-widens-type
        cases:
          - { decl: Dim I As Integer, setup: I = -32768, expr: Abs(I) }
          - { decl: Dim L As Long, setup: L = -2147483647 - 1, expr: Abs(L) }
    quiet:
      - Abs(Null)
      - Abs(Empty)
      - Abs(True)
      - Abs(-1.7976931348623157E+308)
      - { decl: Dim I As Integer, setup: I = -32767, expr: Abs(I) }
      - { decl: Dim L As Long, setup: L = -2147483647, expr: Abs(L) }
      - { decl: Dim V As Variant, setup: V = CInt(-32768), expr: Abs(V) }
      - { decl: Dim V As Variant, setup: V = CLng(-2147483648#), expr: Abs(V) }
      - { decl: Dim C As Currency, setup: C = -922337203685477.5807@, expr: Abs(C) }
      - { decl: Dim D As Variant, setup: 'D = CDec("-79228162514264337593543950335")', expr: Abs(D) }
