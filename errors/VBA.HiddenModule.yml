# The VBA (Default) module, _HiddenModule. Format: WIP.Errors.md.
# Every case is `only: tb`: VB6 and VBA have none of these procedures.
# No case for what crashes (an access violation, 32-bit and 64-bit; the pages' WARNINGs):
# ConvertIconToBitmap of Nothing, GetInheritedOwner of Nothing or of an object that is not a
# control, a Let of RuntimeCreateGetMessageHook's result into a Variant, an address of 0 to the
# GetMem, PutMem and vbaCopyBytes procedures, AddClassInstanceFlag of -1.
# No case for GetNameFromDispID on an object of a twinBASIC class (5), which the probe module
# cannot declare: the page states it in its prose. InternalGetReturnAddress fails a 64-bit
# build, Emit and EmitAny write machine code, ShowPropertyPageEditor given a control shows a
# box: none has a case.
beta: 1010
pages:
  Reference/Default/VBA/HiddenModule/AddClassInstanceFlag.md:
    rows:
      - error: 94
        when: "*Flag* is **Null**"
        cases:
          - { decl: Dim C As New Collection, run: "AddClassInstanceFlag C, Null", only: tb }
          - { decl: Dim C As New Collection, run: "RemoveClassInstanceFlag C, Null", only: tb }
      - error: 424
        when: "*ClassInstance* is **Null**"
        cases:
          - { run: "AddClassInstanceFlag Null, 2048", only: tb }
          - { run: "RemoveClassInstanceFlag Null, 2048", only: tb }
    quiet:
      - { run: "AddClassInstanceFlag Nothing, 2048", only: tb }
      - { run: "RemoveClassInstanceFlag Nothing, 2048", only: tb }
  Reference/Default/VBA/HiddenModule/AllocMem.md:
    rows:
      - error: -2147024882
        when: "*BytesToAlloc* is 0 or less"
        cases:
          - { decl: Dim P As LongPtr, run: "P = AllocMem(0)\nIf P <> 0 Then FreeMem P", only: tb }
          - { decl: Dim P As LongPtr, run: "P = AllocMem(-1)\nIf P <> 0 Then FreeMem P", only: tb }
          - { decl: Dim P As LongPtr, run: "P = AllocMem(-2147483648#)\nIf P <> 0 Then FreeMem P", only: tb }
      - error: -2147024882
        when: "in a 32-bit build, there is not enough memory for the block (2,000,000,000 bytes, for one)"
        win64: 0
        cases:
          - { decl: Dim P As LongPtr, run: "P = AllocMem(2000000000)\nIf P <> 0 Then FreeMem P", only: tb }
      - error: 94
        when: "*BytesToAlloc* is **Null**"
        cases:
          - { decl: Dim P As LongPtr, run: "P = AllocMem(Null)\nIf P <> 0 Then FreeMem P", only: tb }
    quiet:
      - { decl: Dim P As LongPtr, run: "P = AllocMem(1)\nIf P = 0 Then Err.Raise 1001\nFreeMem P", only: tb }
      - { decl: Dim P As LongPtr, run: "P = AllocMem(16)\nIf P = 0 Then Err.Raise 1001\nFreeMem P", only: tb }
  Reference/Default/VBA/HiddenModule/FreeMem.md:
    rows:
      - error: 94
        when: "*MemPointer* is **Null**"
        cases:
          - { run: FreeMem Null, only: tb }
    quiet:
      - { run: FreeMem 0, only: tb }
      - { decl: Dim P As LongPtr, setup: P = AllocMem(16), run: FreeMem P, only: tb }
  Reference/Default/VBA/HiddenModule/ConvertIconToBitmap.md:
    harness: native
    rows:
      - error: -2147467259
        when: "*IconPicture* is not an icon: a bitmap, a picture with no image, or an object that is not a picture"
        cases:
          - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Bitmap(), vbPicTypeBitmap, False))", only: tb }
          - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(0, vbPicTypeNone, False))", only: tb }
          - { expr: ConvertIconToBitmap(LoadPicture()), only: tb }
          - { expr: ConvertIconToBitmap(New Collection), only: tb }
      - error: 5
        when: "*BackColor*'s high byte is other than 0, 1, 2 or &H80 (-1, for one), or it is a system colour above &H8000001E"
        cases:
          - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), -1)", only: tb }
          - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), &H3000000)", only: tb }
          - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), &H8000001F)", only: tb }
          - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), &H800000FF)", only: tb }
      - error: 13
        when: "*BackColor* is a string that does not hold a number"
        cases:
          - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), \"abc\")", only: tb }
      - error: 94
        when: "*BackColor* is **Null**"
        cases:
          - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), Null)", only: tb }
      - error: 424
        when: "*IconPicture* is **Null**"
        cases:
          - { expr: ConvertIconToBitmap(Null), only: tb }
    quiet:
      - { run: "If ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False)).Type <> vbPicTypeBitmap Then Err.Raise 1001", only: tb }
      - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), &HFFFFFF)", only: tb }
      - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), &H80000005)", only: tb }
      - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), &H8000001E)", only: tb }
      - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), &H1000000)", only: tb }
      - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), &H2000000)", only: tb }
      - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), \"255\")", only: tb }
      - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), Empty)", only: tb }
      - { expr: "ConvertIconToBitmap(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False), 1.5)", only: tb }
  Reference/Default/VBA/HiddenModule/CreateStdPictureFromHandle.md:
    harness: native
    rows:
      - error: -2147467259
        when: "*Handle* is not of the kind *Type* names: 0 for an icon, or a bitmap for an icon, a metafile or an enhanced metafile"
        cases:
          - { expr: "CreateStdPictureFromHandle(0, vbPicTypeIcon, False)", only: tb }
          - { expr: "CreateStdPictureFromHandle(native_Bitmap(), vbPicTypeIcon, False)", only: tb }
          - { expr: "CreateStdPictureFromHandle(native_Bitmap(), vbPicTypeMetafile, False)", only: tb }
          - { expr: "CreateStdPictureFromHandle(native_Bitmap(), vbPicTypeEMetafile, False)", only: tb }
      - error: -2147418113
        when: "*Type* is less than 0 or greater than 4"
        cases:
          - { expr: "CreateStdPictureFromHandle(native_Bitmap(), -1, False)", only: tb }
          - { expr: "CreateStdPictureFromHandle(native_Bitmap(), 5, False)", only: tb }
          - { expr: "CreateStdPictureFromHandle(native_Bitmap(), 99, False)", only: tb }
      - error: 94
        when: "an argument is **Null**"
        cases:
          - { expr: "CreateStdPictureFromHandle(Null, vbPicTypeBitmap, False)", only: tb }
          - { expr: "CreateStdPictureFromHandle(native_Bitmap(), Null, False)", only: tb }
          - { expr: "CreateStdPictureFromHandle(native_Bitmap(), vbPicTypeBitmap, Null)", only: tb }
    quiet:
      - { expr: "CreateStdPictureFromHandle(native_Bitmap(), vbPicTypeBitmap, False)", only: tb }
      - { expr: "CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False)", only: tb }
      - { run: "If CreateStdPictureFromHandle(native_Bitmap(), vbPicTypeBitmap, True).Type <> vbPicTypeBitmap Then Err.Raise 1001\nnative_Keep", only: tb }
      - { expr: "CreateStdPictureFromHandle(native_Bitmap(), vbPicTypeNone, False)", only: tb }
      - { expr: "CreateStdPictureFromHandle(0, vbPicTypeNone, False)", only: tb }
      # a bitmap handle is not checked
      - { run: "If CreateStdPictureFromHandle(0, vbPicTypeBitmap, False).Handle <> 0 Then Err.Raise 1001", only: tb }
      - { expr: "CreateStdPictureFromHandle(12345, vbPicTypeBitmap, False)", only: tb }
      - { expr: "CreateStdPictureFromHandle(native_Icon(), vbPicTypeBitmap, False)", only: tb }
  Reference/Default/VBA/HiddenModule/PictureToByteArray.md:
    harness: native
    rows:
      - error: -2147467262
        when: "*Picture* is an object that is not a picture"
        cases:
          - { expr: PictureToByteArray(New Collection), only: tb }
      - error: 424
        when: "*Picture* is **Null**"
        cases:
          - { expr: PictureToByteArray(Null), only: tb }
    quiet:
      # Nothing gives a Byte array with no bounds: UBound raises 9 (the page says so)
      - { run: "Result = PictureToByteArray(Nothing)\nIf VarType(Result) <> vbArray + vbByte Then Err.Raise 1001", only: tb }
      - { run: "Result = PictureToByteArray(Nothing)\nResult = UBound(Result)\nIf Err.Number = 9 Then Err.Clear", only: tb }
      - { expr: PictureToByteArray(LoadPicture()), only: tb }
      - { run: "Result = PictureToByteArray(CreateStdPictureFromHandle(native_Bitmap(), vbPicTypeBitmap, False))\nIf UBound(Result) < 0 Then Err.Raise 1001", only: tb }
      - { expr: "PictureToByteArray(CreateStdPictureFromHandle(native_Icon(), vbPicTypeIcon, False))", only: tb }
  Reference/Default/VBA/HiddenModule/CreateGUID.md:
    quiet:
      - { run: "Result = CreateGUID()\nIf Len(Result) <> 36 Or Mid$(Result, 9, 1) <> \"-\" Then Err.Raise 1001", only: tb }
      - { run: "If CreateGUID() = CreateGUID() Then Err.Raise 1001", only: tb }
  Reference/Default/VBA/HiddenModule/Eval.md:
    harness: expression
    rows:
      - error: -2147467259
        when: "*Expression* is a zero-length string or is not an expression, or it names something the standard library does not have"
        cases:
          - { expr: 'Eval("")', only: tb }
          - { expr: 'Eval(" ")', only: tb }
          - { expr: Eval(Empty), only: tb }
          - { expr: 'Eval("1 2")', only: tb }
          - { expr: 'Eval("""abc")', only: tb }
          - { expr: 'Eval("Dim x")', only: tb }
          - { expr: 'Eval("Err.Raise 5")', only: tb }
          - { expr: 'Eval("New Collection")', only: tb }
          - { expr: 'Eval("Foo")', only: tb }
          - { expr: 'Eval("Foo(1)")', only: tb }
          - { expr: 'Eval("x = 1")', only: tb }
          - { expr: 'Eval("Sqr()")', only: tb }
          - { expr: 'Eval("Sqr(1, 2)")', only: tb }
      - error: -2147467259
        when: "evaluating *Expression* raises an error, whatever its number: division by zero, an overflow, a type mismatch, an argument a function refuses"
        cases:
          - { expr: 'Eval("1 / 0")', only: tb }
          - { expr: 'Eval("1 \ 0")', only: tb }
          - { expr: 'Eval("1 Mod 0")', only: tb }
          - { expr: 'Eval("2 ^ 2000")', only: tb }
          - { expr: 'Eval("CInt(40000)")', only: tb }
          - { expr: 'Eval("CInt(""abc"")")', only: tb }
          - { expr: 'Eval("Sqr(-1)")', only: tb }
          - { expr: 'Eval("Mid(""abc"", 0)")', only: tb }
          - { expr: 'Eval("Array(1, 2)(5)")', only: tb }
      - error: -2147467259
        when: "the value of *Expression* is an **Error** value, or *Expression* calls **Len** with **Null**"
        cases:
          - { expr: 'Eval("CVErr(5)")', only: tb }
          - { expr: 'Eval("Len(Null)")', only: tb }
      - error: 94
        when: "*Expression* is **Null**"
        cases:
          - { expr: Eval(Null), only: tb }
    quiet:
      - { run: "If Eval(\"2 * (Sqr(4) + 1)\") <> 6 Then Err.Raise 1001", only: tb }
      - { run: "If Eval(\"UCase(\"\"hello\"\")\") <> \"HELLO\" Then Err.Raise 1001", only: tb }
      - { run: "If Not IsNull(Eval(\"Null + 1\")) Then Err.Raise 1001", only: tb }
      - { run: "If Not IsNull(Eval(\"Mid(Null, 1)\")) Then Err.Raise 1001", only: tb }
      - { run: "If Eval(\"IsError(CVErr(5))\") <> True Then Err.Raise 1001", only: tb }
      - { expr: 'Eval("Nothing")', only: tb }
      - { run: "If Eval(12) <> 12 Then Err.Raise 1001", only: tb }
      # a bug: a dangling operator or parenthesis is ignored (bugs/pending; the page's WARNING)
      - { run: "If Eval(\"2 +\") <> 2 Then Err.Raise 1001", only: tb }
      - { run: "If Eval(\"2 Mod\") <> 2 Then Err.Raise 1001", only: tb }
      - { run: "If Eval(\"(2\") <> 2 Then Err.Raise 1001", only: tb }
      - { run: "If Eval(\"2)\") <> 2 Then Err.Raise 1001", only: tb }
