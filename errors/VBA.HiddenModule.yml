  Reference/Default/VBA/HiddenModule/GetNameFromDispID.md:
    rows:
      - error: -2147467261
        when: "*Object* is **Nothing**"
        cases:
          - { expr: "GetNameFromDispID(Nothing, 0)", only: tb }
          - { run: "ShowPropertyPageEditor \"x\", Nothing, 0", harness: dialog, only: tb }
      - error: -2147467263
        when: "**GetNameFromDispID** is given an object that has no type information, such as a **Collection**"
        cases:
          - { expr: "GetNameFromDispID(New Collection, 0)", only: tb }
          - { expr: "GetNameFromDispID(Err, 0)", only: tb }
          - { expr: "GetNameFromDispID(New PropertyBag, 0)", only: tb }
      - error: -2147467262
        when: "**GetNameFromDispID** is given an object that does not support **IDispatch**, such as a **TbExpressionService**"
        cases:
          - { expr: "GetNameFromDispID(New TbExpressionService, 0)", only: tb }
          - { expr: "GetNameFromDispID(App, 0)", only: tb }
          - { expr: "GetNameFromDispID(Screen, 0)", only: tb }
      - error: -2147467262
        when: "**ShowPropertyPageEditor** is given an object that has no property pages"
        cases:
          - { run: "ShowPropertyPageEditor \"x\", New Collection, 0", harness: dialog, only: tb }
          - { run: "ShowPropertyPageEditor \"x\", CreateObject(\"Scripting.Dictionary\"), 0", harness: dialog, only: tb }
      - error: -2147319765
        when: "**GetNameFromDispID** is given an object described by a type library, such as a **Scripting.Dictionary**, and a *DispID* that is no member's"
        cases:
          - { expr: "GetNameFromDispID(CreateObject(\"Scripting.Dictionary\"), 999)", only: tb }
          - { expr: "GetNameFromDispID(New StdFont, 99999)", only: tb }
      - error: 94
        when: "*Caption* or *DispID* is **Null**"
        cases:
          - { expr: "GetNameFromDispID(CreateObject(\"Scripting.Dictionary\"), Null)", only: tb }
          - { run: "ShowPropertyPageEditor Null, CreateObject(\"Scripting.Dictionary\"), 0", harness: dialog, only: tb }
          - { run: "ShowPropertyPageEditor \"x\", CreateObject(\"Scripting.Dictionary\"), Null", harness: dialog, only: tb }
      - error: 424
        when: "*Object* is **Null**"
        cases:
          - { expr: "GetNameFromDispID(Null, 0)", only: tb }
          - { run: "ShowPropertyPageEditor \"x\", Null, 0", harness: dialog, only: tb }
    quiet:
      - { run: "If GetNameFromDispID(CreateObject(\"Scripting.Dictionary\"), 0) <> \"Item\" Then Err.Raise 1001", only: tb }
      - { run: "If GetNameFromDispID(CreateObject(\"Scripting.Dictionary\"), 2) <> \"Count\" Then Err.Raise 1001", only: tb }
      - { run: "If GetNameFromDispID(CreateObject(\"Scripting.Dictionary\"), -4) <> \"_NewEnum\" Then Err.Raise 1001", only: tb }
      - { expr: "GetNameFromDispID(New StdFont, 0)", only: tb }
