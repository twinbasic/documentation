  Reference/Default/VBA/HiddenModule/vbaCastObj.md:
    harness: native
    rows:
      - error: 424
        when: "*Obj* is **Null**"
        cases:
          - { expr: "vbaCastObj(Null, native_StdIid(0))", only: tb }
    quiet:
      - { run: "If vbaCastObj(New Collection, native_StdIid(0)) Is Nothing Then Err.Raise 1001", only: tb }
      - { run: "If vbaCastObj(New Collection, native_StdIid(&H20400)) Is Nothing Then Err.Raise 1001", only: tb }
