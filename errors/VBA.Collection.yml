# The VBA Collection class. Format: WIP.Errors.md.
beta: 1010
pages:
  Reference/Default/VBA/Collection/Add.md:
    rows:
      - error: 457
        when: "*key* is already the key of an item in the collection, as [**KeyCompareMode**](KeyCompareMode) compares keys (by default `\"A\"` and `\"a\"` are the same key)"
        cases:
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: 'C.Add 2, "a"' }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: 'C.Add 2, "A"' }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, ""', run: 'C.Add 2, ""' }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: 'C.Add 2, "a", "z"' }
      - error: 13
        when: "*key* is not a **String**: a number, **True**, **Null**, an object, **Nothing** or an array"
        cases:
          - { decl: Dim C As New Collection, run: 'C.Add 1, Null' }
          - { decl: Dim C As New Collection, run: 'C.Add 1, 5' }
          - { decl: Dim C As New Collection, run: 'C.Add 1, 5.5' }
          - { decl: Dim C As New Collection, run: 'C.Add 1, True' }
          - { decl: "Dim C As New Collection\nDim D As New Collection", run: 'C.Add 1, D' }
          - { decl: Dim C As New Collection, run: 'C.Add 1, Nothing' }
          - { decl: Dim C As New Collection, run: 'C.Add 1, Array("a")' }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: 'C.Add 2, Null, "z"' }
      - error: 0
        when: "*key* is **Empty**"
        vb6: 13
        bug: pending
        cases:
          - { decl: Dim C As New Collection, run: "C.Add 1, Empty\nIf C.Count = 1 And UBound(C.Keys) = -1 Then Err.Clear Else Err.Raise 1001", only: tb }
          - { decl: Dim C As New Collection, run: 'C.Add 1, Empty' }
      - error: 5
        when: "both *before* and *after* are given"
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , 1, 1' }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: 'C.Add 2, "b", "a", "a"' }
      - error: 5
        when: "*before* or *after* is given and the collection is empty"
        cases:
          - { decl: Dim C As New Collection, run: 'C.Add 1, , 1' }
          - { decl: Dim C As New Collection, run: 'C.Add 1, , , 1' }
          - { decl: Dim C As New Collection, run: 'C.Add 1, , 0' }
          - { decl: Dim C As New Collection, run: 'C.Add 1, , , 0' }
          - { decl: Dim C As New Collection, run: 'C.Add 1, "a", 1' }
          - { decl: Dim C As New Collection, run: 'C.Add 2, , -1' }
          - { decl: Dim C As New Collection, run: 'C.Add 2, , Null' }
          - { decl: Dim C As New Collection, run: 'C.Add 2, , "a"' }
          - { decl: Dim C As New Collection, setup: "C.Add 1\nC.Remove 1", run: 'C.Add 2, , 1' }
      - error: 5
        when: "*before* or *after* is a string that is not the key of an item"
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , ""' }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: 'C.Add 2, , "b"' }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: 'C.Add 2, , , "b"' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , "1"' }
      - error: 9
        when: "*before* or *after* is a number that, rounded, is less than 1 or greater than **Count** (the notes below give the exceptions)"
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , 0' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , 0.5' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , -2' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , , 2' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , , 1.5' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , 2147483647' }
          - { decl: Dim C As New Collection, setup: "C.Add 1\nC.Add 2", run: 'C.Add 3, , 4' }
          - { decl: Dim C As New Collection, setup: "C.Add 1\nC.Add 2", run: 'C.Add 3, , , 3' }
      - error: 0
        when: "*before* is one more than **Count**, after rounding"
        vb6: 9
        bug: pending
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: "C.Add 2, , 2\nIf C(2) = 2 Then Err.Clear Else Err.Raise 1001", only: tb }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , 2' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , 1.5' }
          - { decl: Dim C As New Collection, setup: "C.Add 1\nC.Add 2", run: 'C.Add 3, , 3' }
      - error: 0
        when: "*after* is 0, after rounding"
        vb6: 9
        bug: pending
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: "C.Add 2, , , 0\nIf C(1) = 2 Then Err.Clear Else Err.Raise 1001", only: tb }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , , 0' }
          - { decl: Dim C As New Collection, setup: "C.Add 1\nC.Add 2", run: 'C.Add 3, , , 0' }
      - error: 13
        when: "*before* or *after* is -1, **True** or **Empty**"
        vb6: 9
        bug: collection-index-checks
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , -1' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , , -1' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , True' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , Empty' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , , Empty' }
      - error: 13
        when: "*before* or *after* is a **Currency**, **Decimal** or **Date** value"
        vb6: 0
        bug: collection-index-checks
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , CCur(1)' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , , CCur(1)' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , CDec(1)' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , CDate(1)' }
      - error: 9
        when: "*before* or *after* is a number outside the **Long** range"
        vb6: 13
        bug: collection-index-checks
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , 2147483648#' }
      - error: 13
        when: "*before* or *after* is **Null**, an object or **Nothing**, and the collection is not empty"
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , Null' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , , Null' }
          - { decl: "Dim C As New Collection\nDim D As New Collection", setup: C.Add 1, run: 'C.Add 2, , D' }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , Nothing' }
    quiet:
      - { decl: Dim C As New Collection, run: C.Add 1 }
      - { decl: Dim C As New Collection, run: 'C.Add 1, ""' }
      - { decl: Dim C As New Collection, run: C.Add Null }
      - { decl: Dim C As New Collection, run: C.Add Nothing }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , 1' }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , , 1' }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: 'C.Add 2, , "A"' }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: 'C.Add 2, , , "a"' }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "1"', run: 'C.Add 2, , "1"' }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , CInt(1)' }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , CSng(1)' }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , CByte(1)' }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: 'C.Add 2, , CLngLng(1)', only: [tb, vba64] }
      - { decl: Dim C As New Collection, setup: "C.Add 1\nC.Add 2", run: 'C.Add 3, , 1.5' }
  Reference/Default/VBA/Collection/Item.md:
    rows:
      - error: 9
        when: "*index* is a number that, rounded, is less than 1 or greater than **Count**, and the collection is not empty"
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(0) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(2) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(-1) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(0.5) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(1.5) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(Empty) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(True) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: 'C.Item(#1/1/2000#)' }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(-2147483648#) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CCur(0)) }
      - error: 9
        when: "the collection is empty and *index* is not a string"
        vb6: 5
        bug: collection-index-checks
        cases:
          - { decl: Dim C As New Collection, expr: C.Item(1) }
          - { decl: Dim C As New Collection, expr: C.Item(0) }
          - { decl: Dim C As New Collection, expr: C.Item(-1) }
          - { decl: Dim C As New Collection, expr: C.Item(Null) }
          - { decl: Dim C As New Collection, expr: C.Item(Empty) }
          - { decl: Dim C As New Collection, setup: "C.Add 1\nC.Remove 1", expr: C.Item(1) }
      - error: 9
        when: "*index* is **Null**, an object, **Nothing**, an array, an error value or a number outside the **Long** range, and the collection is not empty"
        vb6: 13
        bug: collection-index-checks
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(Null) }
          - { decl: "Dim C As New Collection\nDim D As New Collection", setup: C.Add 1, expr: C.Item(D) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(Nothing) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(Array(1)) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CVErr(1)) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(2147483648#) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(-2147483649#) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(1E+300) }
      - error: 9
        when: "*index* is a **Currency**, **Decimal** or **Date** value"
        vb6: 0
        bug: collection-index-checks
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CCur(1)) }
          - { decl: "Dim C As New Collection\nDim N As Currency", setup: "C.Add 1\nN = 1", expr: C.Item(N) }
          - { decl: Dim C As New Collection, setup: "C.Add 1\nC.Add 2", expr: C.Item(CCur(2)) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CDec(1)) }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CDate(1)) }
      - error: 5
        when: "*index* is a string that is not the key of an item"
        cases:
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', expr: C.Item("b") }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', expr: C.Item("") }
          - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item("1") }
          - { decl: Dim C As New Collection, expr: C.Item("b") }
    quiet:
      - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(1) }
      - { decl: Dim C As New Collection, setup: C.Add 1, expr: C(1) }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', expr: C.Item("a") }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', expr: C.Item("A") }
      - { decl: Dim C As New Collection, setup: "C.Add 1\nC.Add 2", expr: C.Item(1.5) }
      - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CByte(1)) }
      - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CInt(1)) }
      - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CLng(1)) }
      - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CSng(1)) }
      - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CDbl(1)) }
      - { decl: Dim C As New Collection, setup: C.Add 1, expr: C.Item(CLngLng(1)), only: [tb, vba64] }
  Reference/Default/VBA/Collection/Remove.md:
    rows:
      - error: 9
        when: "*index* is a number that, rounded, is less than 1 or greater than **Count**, and the collection is not empty"
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove 0 }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove 2 }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove -1 }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove 0.5 }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove 1.5 }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove Empty }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove True }
      - error: 5
        when: "*index* is a string that is not the key of an item"
        cases:
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: C.Remove "b" }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: C.Remove "" }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove "1" }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: "C.Remove \"a\"\nC.Remove \"a\"" }
      - error: 5
        when: "the collection is empty"
        cases:
          - { decl: Dim C As New Collection, run: C.Remove 1 }
          - { decl: Dim C As New Collection, run: C.Remove 0 }
          - { decl: Dim C As New Collection, run: C.Remove -1 }
          - { decl: Dim C As New Collection, run: C.Remove Null }
          - { decl: Dim C As New Collection, run: C.Remove Empty }
          - { decl: Dim C As New Collection, run: C.Remove "a" }
      - error: 9
        when: "*index* is **Null**, an object, **Nothing**, an array or a number outside the **Long** range, and the collection is not empty"
        vb6: 13
        bug: collection-index-checks
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove Null }
          - { decl: "Dim C As New Collection\nDim D As New Collection", setup: C.Add 1, run: C.Remove D }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove Nothing }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove Array(1) }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove 2147483648# }
      - error: 9
        when: "*index* is a **Currency**, **Decimal** or **Date** value"
        vb6: 0
        bug: collection-index-checks
        cases:
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove CCur(1) }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove CDec(1) }
          - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove CDate(1) }
    quiet:
      - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove 1 }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: C.Remove "A" }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove CInt(1) }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove CSng(1) }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: C.Remove CLngLng(1), only: [tb, vba64] }
  Reference/Default/VBA/Collection/Count.md:
    quiet:
      - { decl: Dim C As New Collection, expr: C.Count }
  Reference/Default/VBA/Collection/Clear.md:
    quiet:
      - { decl: Dim C As New Collection, run: C.Clear, only: tb }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: "C.Clear\nC.Add 2, \"a\"", only: tb }
  Reference/Default/VBA/Collection/Exists.md:
    rows:
      - error: 94
        when: "*key* is **Null**"
        cases:
          - { decl: Dim C As New Collection, expr: C.Exists(Null), only: tb }
    quiet:
      - { decl: Dim C As New Collection, expr: C.Exists("a"), only: tb }
      - { decl: Dim C As New Collection, expr: C.Exists(""), only: tb }
      - { decl: Dim C As New Collection, expr: C.Exists(Empty), only: tb }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "1"', run: "If Not C.Exists(1) Then Err.Raise 1001", only: tb }
  Reference/Default/VBA/Collection/Items.md:
    quiet:
      - { decl: Dim C As New Collection, expr: UBound(C.Items), only: tb }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: "Result = C.Items\nResult = Result(0)", only: tb }
  Reference/Default/VBA/Collection/Keys.md:
    quiet:
      - { decl: Dim C As New Collection, expr: UBound(C.Keys), only: tb }
      - { decl: Dim C As New Collection, setup: C.Add 1, expr: UBound(C.Keys), only: tb }
  Reference/Default/VBA/Collection/KeyCompareMode.md:
    rows:
      - error: 5
        when: "*compare* is not **vbBinaryCompare** or **vbTextCompare** after rounding"
        cases:
          - { decl: Dim C As New Collection, run: C.KeyCompareMode = 2, only: tb }
          - { decl: Dim C As New Collection, run: C.KeyCompareMode = -1, only: tb }
          - { decl: Dim C As New Collection, run: C.KeyCompareMode = 1033, only: tb }
          - { decl: Dim C As New Collection, run: C.KeyCompareMode = 1.5, only: tb }
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: C.KeyCompareMode = 2, only: tb }
      - error: 5
        when: "the mode is changed while the collection holds an item added with a key; the mode stays as it was"
        message: "Can't change KeyCompareMode once keyed items have been added to the collection"
        cases:
          - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: C.KeyCompareMode = 0, only: tb }
          - { decl: Dim C As New Collection, setup: "C.KeyCompareMode = 0\nC.Add 1, \"a\"", run: C.KeyCompareMode = 1, only: tb }
      - error: 94
        when: "*compare* is **Null**"
        cases:
          - { decl: Dim C As New Collection, run: C.KeyCompareMode = Null, only: tb }
    quiet:
      - { decl: Dim C As New Collection, expr: C.KeyCompareMode, only: tb }
      - { decl: Dim C As New Collection, run: C.KeyCompareMode = 0, only: tb }
      - { decl: Dim C As New Collection, run: C.KeyCompareMode = 1, only: tb }
      - { decl: Dim C As New Collection, run: C.KeyCompareMode = 0.5, only: tb }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: C.KeyCompareMode = 1, only: tb }
      - { decl: Dim C As New Collection, setup: C.Add 1, run: C.KeyCompareMode = 0, only: tb }
      - { decl: Dim C As New Collection, setup: "C.Add 1, \"a\"\nC.Remove 1", run: C.KeyCompareMode = 0, only: tb }
      - { decl: Dim C As New Collection, setup: "C.Add 1, \"a\"\nC.Clear", run: C.KeyCompareMode = 0, only: tb }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: "C.KeyCompareMode = 0\nErr.Clear\nIf C.KeyCompareMode <> 1 Then Err.Raise 1001", only: tb }
  Reference/Default/VBA/Collection/KeyCountHint.md:
    rows:
      - error: 94
        when: "*hint* is **Null**"
        cases:
          - { decl: Dim C As New Collection, run: C.KeyCountHint = Null, only: tb }
    quiet:
      - { decl: Dim C As New Collection, expr: C.KeyCountHint, only: tb }
      - { decl: Dim C As New Collection, run: C.KeyCountHint = 0, only: tb }
      - { decl: Dim C As New Collection, run: C.KeyCountHint = 100, only: tb }
      - { decl: Dim C As New Collection, run: C.KeyCountHint = -1, only: tb }
      - { decl: Dim C As New Collection, setup: 'C.Add 1, "a"', run: C.KeyCountHint = 100, only: tb }
