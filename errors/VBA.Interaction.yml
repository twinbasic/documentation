  Reference/Default/VBA/Interaction/SendKeys.md:
    harness: keys
    rows:
      - error: 94
        when: "*string* is **Null**"
        cases:
          - { run: SendKeys Null }
      - error: -2147352567
        when: "*string* has a brace that is not closed or not opened, an unknown key code (`{INS}` and `{F17}` included), a count in braces that is not a whole number from 0 to 8,175, unbalanced parentheses, or a modifier with nothing after it (`++`)"
        vb6: 5
        bug: argument-errors-unspecified-error
        cases:
          - { run: 'SendKeys "{"' }
          - { run: 'SendKeys "}"' }
          - { run: 'SendKeys "{}"' }
          - { run: 'SendKeys "{BAD}"' }
          - { run: 'SendKeys "a{BAD}"' }
          - { run: 'SendKeys "{INS}"' }
          - { run: 'SendKeys "{F17}"' }
          - { run: 'SendKeys "{LEFT x}"' }
          - { run: 'SendKeys "{LEFT -1}"' }
          - { run: 'SendKeys "{LEFT 32767}"' }
          - { run: 'SendKeys "{a 8176}"' }
          - { run: 'SendKeys "{a 1.5}"' }
          - { run: 'SendKeys "{LEFT2}"' }
          - { run: 'SendKeys "("' }
          - { run: 'SendKeys ")"' }
          - { run: 'SendKeys "+(a"' }
          - { run: 'SendKeys "a)"' }
          - { run: 'SendKeys "++"' }
      - error: -2147352567
        when: "*wait* is **Null**"
        vb6: 94
        bug: argument-errors-unspecified-error
        cases:
          - { run: 'SendKeys "a", Null' }
      - error: -2147352567
        when: "*wait* is a string that is not a **Boolean**"
        vb6: 13
        bug: argument-errors-unspecified-error
        cases:
          - { run: 'SendKeys "a", "x"' }
    quiet:
      # The first case after the refused ones sends the keys VB6 and VBA kept from them.
      - { setup: "SendKeys \"\"\nkeys_Clear", run: "SendKeys \"\"\nkeys_Expect \"\"" }
      - { run: "SendKeys \"a\"\nkeys_Expect \"41d 41u\"" }
      - { run: "SendKeys \"A\"\nkeys_Expect \"10d 41d 41u 10u\"" }
      - { run: "SendKeys 123\nkeys_Expect \"31d 31u 32d 32u 33d 33u\"" }
      - { run: "SendKeys \"+(EC)\"\nkeys_Expect \"10d 45d 45u 43d 43u 10u\"" }
      - { run: "SendKeys \"^%a\"\nkeys_Expect \"11d 12d 41d 41u 11u 12u\"" }
      - { run: "SendKeys \"{+}{^}{%}{~}{(}{)}\"\nkeys_Expect \"10d BBd BBu 10u 10d 36d 36u 10u 10d 35d 35u 10u 10d C0d C0u 10u 10d 39d 39u 10u 10d 30d 30u 10u\"" }
      - { run: "SendKeys \"{{}{}}\"\nkeys_Expect \"10d DBd DBu 10u 10d DDd DDu 10u\"" }
      - { run: "SendKeys \"~\"\nkeys_Expect \"Dd Du\"" }
      - { run: "SendKeys \"{LEFT 2}{h 3}\"\nkeys_Expect \"25d 25u 25d 25u 48d 48u 48d 48u 48d 48u\"" }
      - { run: "SendKeys \"{LEFT 0}{a 0}\"\nkeys_Expect \"\"" }
      - { run: "SendKeys \"{BS}{BKSP}{BACKSPACE}{BREAK}{CAPSLOCK}{DEL}{DELETE}{DOWN}{END}{ENTER}{ESC}{HELP}\"\nkeys_Expect \"8d 8u 8d 8u 8d 8u 3d 3u 14d 14u 2Ed 2Eu 2Ed 2Eu 28d 28u 23d 23u Dd Du 1Bd 1Bu 2Fd 2Fu\"" }
      - { run: "SendKeys \"{HOME}{INSERT}{left}{NUMLOCK}{PGDN}{PGUP}{RIGHT}{SCROLLLOCK}{TAB}{UP}\"\nkeys_Expect \"24d 24u 2Dd 2Du 25d 25u 90d 90u 22d 22u 21d 21u 27d 27u 91d 91u 9d 9u 26d 26u\"" }
      - { run: "SendKeys \"{F1}{F12}{F16}{PRTSC}\"\nkeys_Expect \"70d 70u 7Bd 7Bu 7Fd 7Fu 2Ad 2Au\"" }
      - { run: "SendKeys \"{ENTER 2}\"\nkeys_Expect \"Dd Du Dd Du\"" }
      - { run: 'SendKeys "{a 8175}"' }
      - { run: 'SendKeys "{a 5000}{a 5000}"' }
      - { run: "SendKeys \"{a 02}\"\nkeys_Expect \"41d 41u 41d 41u\"" }
      - { run: "SendKeys \"a\", True\nkeys_Expect \"41d 41u\"" }
      - { run: "SendKeys \"a\", False\nkeys_Expect \"41d 41u\"" }
      - { run: "SendKeys \"a\", 2\nkeys_Expect \"41d 41u\"" }
      # An extension (owner, 2026-10-27): VB6 and 64-bit VBA raise 13.
      - { run: "SendKeys \"a\", \"True\"\nkeys_Expect \"41d 41u\"", only: tb }
  Reference/Default/VBA/Interaction/AppActivate.md:
    harness: window
    rows:
      - error: 94
        when: "*title* is **Null**"
        cases:
          - { run: AppActivate Null }
      - error: -2147467259
        when: "no window has *title* as its title, or its beginning or end, and no process with *title* as its task ID has a window (0, a negative number, **True** and **Empty** included)"
        vb6: 5
        bug: argument-errors-unspecified-error
        cases:
          - { run: AppActivate "xqzzy no such window" }
          - { run: AppActivate 0 }
          - { run: AppActivate -1 }
          - { run: AppActivate 4 }
          - { run: AppActivate 2147483647 }
          - { run: AppActivate True }
          - { run: AppActivate Empty }
      - error: 0
        when: "the window *title* names is hidden"
        vb6: 5
        bug: interaction-missing-argument-checks
        cases:
          - { setup: window_Hide, run: AppActivate window_Title() }
      - error: 0
        when: "*wait* is **Null**"
        vb6: 94
        bug: interaction-missing-argument-checks
        cases:
          - { run: "AppActivate window_Title(), Null" }
      - error: 0
        when: "*wait* is a string that is not a **Boolean**"
        vb6: 13
        bug: interaction-missing-argument-checks
        cases:
          - { run: "AppActivate window_Title(), \"x\"" }
    quiet:
      - { run: "AppActivate window_Title()\nIf Not window_Visible() Then Err.Raise 1001, , \"hidden\"" }
      - { run: AppActivate LCase$(window_Title()) }
      - { run: "AppActivate Left$(window_Title(), 12)" }
      - { run: "AppActivate Mid$(window_Title(), 7)" }
      - { run: AppActivate window_Pid() }
      - { run: AppActivate CStr(window_Pid()) }
      - { run: AppActivate CDbl(window_Pid()) }
      - { setup: window_Minimize, run: "AppActivate window_Title()\nIf Not window_Minimized() Then Err.Raise 1001, , \"restored\"" }
      - { run: "AppActivate window_Title(), False" }
      # An extension (owner, 2026-10-27): VB6 raises 5; 64-bit VBA raises nothing, as twinBASIC.
      - { run: AppActivate "", only: [tb, vba64] }
