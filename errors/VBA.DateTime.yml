# The VBA DateTime module. Format: WIP.Errors.md.
#
# Date and Time run under the clock harness (errors/harnesses/clock.bas): the clock
# setters are replaced for the length of each case, so a value that is accepted raises
# nothing, the real clock is never set, and clock_Expect checks what would have been set
# (the date part for Date and Date$, the time part for Time and Time$). A number is an
# extension of twinBASIC's (owner, 2026-10-22): VB6 raises 13 for one, so those cases are
# only: tb.
#
# Calendar is not implemented in twinBASIC (TB0009), and the owner chose not to report
# it, so its cases are twinBASIC-only and have no VB6 NOTE. In VB6 vbCalHijri succeeds
# and stays: a VB6 case that sets it must set vbCalGreg again.
beta: 1010
pages:
  Reference/Default/VBA/DateTime/Calendar.md:
    rows:
      - error: -2147467259
        when: "**Calendar** is set to any value other than **Null**, **vbCalGreg** included"
        cases:
          - { run: Calendar = vbCalGreg, only: tb }
          - { run: Calendar = vbCalHijri, only: tb }
          - { run: 'Calendar = "1"', only: tb }
          - { run: Calendar = 2, only: tb }
          - { run: Calendar = -1, only: tb }
      - error: 94
        when: "*calendartype* is **Null**"
        cases:
          - { run: Calendar = Null }
    quiet:
      - Calendar
  Reference/Default/VBA/DateTime/Date.md:
    harness: clock
    rows:
      - error: 13
        when: "**Date** is given a string that is not a date, or a number outside the range of dates"
        cases:
          - { run: 'Date = "abc"' }
          - { run: 'Date = "February 30, 2020"' }
          - { run: 'Date = "1/1/10000"' }
          - { run: Date = 2958466 }
          - { run: Date = -657435 }
          - { run: Date = 3000000 }
          - { run: Date = 1E+300 }
          - { run: Date = CVErr(5) }
      - error: -2147467259
        when: "**Date$** is given a value that is not a date of the form *mm-dd-yyyy*"
        vb6: 5
        bug: date-time-set-errors
        cases:
          - { run: 'Date$ = "abc"' }
          - { run: 'Date$ = ""' }
          - { run: 'Date$ = "2000-01-01"' }
          - { run: 'Date$ = "January 1, 2000"' }
          - { run: Date$ = 36526 }
          - { run: Date$ = Empty }
          - { run: 'Date$ = "02-30-2000"' }
          - { run: 'Date$ = "13-01-2000"' }
      - error: -2147467259
        when: "**Date** or **Date$** is given a date before January 1, 1601, which Windows cannot set"
        vb6: 5
        bug: date-time-set-errors
        cases:
          - { run: 'Date = #12/31/1600#' }
          - { run: 'Date = #1/1/100#' }
          - { run: 'Date = "1/1/1000"' }
          - { run: 'Date$ = "12-31-1600"' }
          - { run: Date = -657434, only: tb }
      - error: -2147467259
        when: "**Date$** is given a date in another form VB6 reads, such as *m-d-yyyy*, *m/d/yyyy* or *mm-dd-yy*"
        vb6: 0
        bug: date-time-set-errors
        cases:
          - { run: "Date$ = \"1-2-2000\"\nclock_Expect #1/2/2000#, Null" }
          - { run: "Date$ = \"1/2/2000\"\nclock_Expect #1/2/2000#, Null" }
          - { run: "Date$ = \"01-02-00\"\nclock_Expect #1/2/2000#, Null" }
      - error: 94
        when: "**Date$** is given **Null**"
        cases:
          - { run: Date$ = Null }
      - error: 94
        when: "**Date** is given **Null**"
        vb6: 13
        bug: date-time-set-errors
        cases:
          - { run: Date = Null }
    quiet:
      - Date
      - Date$
      - { run: "Date = Date\nclock_Expect Date, Null" }
      - { run: "Date = #1/1/2000#\nclock_Expect #1/1/2000#, Null" }
      - { run: "Date = #1/1/2000 6:00:00 PM#\nclock_Expect #1/1/2000#, Null" }
      - { run: "Date = #12/31/9999#\nclock_Expect #12/31/9999#, Null" }
      - { run: "Date = #1/1/1601#\nclock_Expect #1/1/1601#, Null" }
      - { run: "Date$ = \"01-01-1601\"\nclock_Expect #1/1/1601#, Null" }
      - { run: "Date = \"1/1/2000\"\nclock_Expect #1/1/2000#, Null" }
      - { run: "Date = \"January 1, 2000\"\nclock_Expect #1/1/2000#, Null" }
      - { run: "Date = CDate(36526.75)\nclock_Expect #1/1/2000#, Null" }
      - { run: "Date$ = \"01-02-2000\"\nclock_Expect #1/2/2000#, Null" }
      - { run: "Date$ = Format$(Date, \"mm-dd-yyyy\")\nclock_Expect Date, Null" }
      - { run: "Date = 36526\nclock_Expect #1/1/2000#, Null", only: tb }
      - { run: "Date = 36526.75\nclock_Expect #1/1/2000#, Null", only: tb }
      - { run: "Date = 0\nclock_Expect #12/30/1899#, Null", only: tb }
      - { run: "Date = 0.5\nclock_Expect #12/30/1899#, Null", only: tb }
      - { run: "Date = -1\nclock_Expect #12/29/1899#, Null", only: tb }
      - { run: "Date = -0.5\nclock_Expect #12/30/1899#, Null", only: tb }
      - { run: "Date = -1.5\nclock_Expect #12/29/1899#, Null", only: tb }
      - { run: "Date = 2958465\nclock_Expect #12/31/9999#, Null", only: tb }
      - { run: "Date = 2958465.99999\nclock_Expect #12/31/9999#, Null", only: tb }
      - { run: "Date = Empty\nclock_Expect #12/30/1899#, Null", only: tb }
      - { run: "Date = False\nclock_Expect #12/30/1899#, Null", only: tb }
      - { run: "Date = True\nclock_Expect #12/29/1899#, Null", only: tb }
      - { run: "Date = CByte(5)\nclock_Expect #1/4/1900#, Null", only: tb }
      - { run: "Date = CLng(36526)\nclock_Expect #1/1/2000#, Null", only: tb }
      - { run: "Date = CSng(36526.5)\nclock_Expect #1/1/2000#, Null", only: tb }
      - { run: "Date = CCur(36526.5)\nclock_Expect #1/1/2000#, Null", only: tb }
      - { run: "Date = CDec(36526.25)\nclock_Expect #1/1/2000#, Null", only: tb }
      - { run: "Date = \"36526\"\nclock_Expect #1/1/2000#, Null", only: tb }
