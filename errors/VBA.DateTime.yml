  Reference/Default/VBA/DateTime/DateAdd.md:
    rows:
      - error: 5
        when: "*interval* is not one of the settings listed"
        cases:
          - 'DateAdd("x", 1, #1/1/2000#)'
          - 'DateAdd("", 1, #1/1/2000#)'
          - 'DateAdd("dd", 1, #1/1/2000#)'
          - 'DateAdd(" d", 1, #1/1/2000#)'
          - 'DateAdd(1, 1, #1/1/2000#)'
      - error: 5
        when: 'the result would be after December 31, 9999, or before January 1, 100 for an *interval* other than "yyyy", "q" or "m"'
        cases:
          - 'DateAdd("d", 1, #12/31/9999#)'
          - 'DateAdd("s", 1, #12/31/9999 11:59:59 PM#)'
          - 'DateAdd("n", 1, #12/31/9999 11:59:00 PM#)'
          - 'DateAdd("h", 1, #12/31/9999 11:00:00 PM#)'
          - 'DateAdd("y", 1, #12/31/9999#)'
          - 'DateAdd("w", 1, #12/31/9999#)'
          - 'DateAdd("ww", 1, #12/30/9999#)'
          - 'DateAdd("m", 1, #12/1/9999#)'
          - 'DateAdd("q", 1, #11/1/9999#)'
          - 'DateAdd("yyyy", 1, #1/1/9999#)'
          - 'DateAdd("d", 2147483647, #1/1/2000#)'
          - 'DateAdd("d", -1, #1/1/100#)'
          - 'DateAdd("h", -1, #1/1/100#)'
          - 'DateAdd("ww", -1, #1/5/100#)'
          - 'DateAdd("yyyy", -10000, #1/1/2000#)'
      - error: 0
        when: 'the result with an *interval* of "yyyy", "q" or "m" would be before January 1, 100'
        vb6: 5
        bug: dateadd-year-below-100
        cases:
          - 'DateAdd("yyyy", -1, #1/1/100#)'
          - 'DateAdd("yyyy", -1901, #1/1/2000#)'
          - 'DateAdd("q", -1, #1/1/100#)'
          - 'DateAdd("m", -1, #1/1/100#)'
      - error: 6
        when: "*date* is a number outside the range of dates"
        vb6: 13
        bug: dateadd-date-out-of-range-overflow
        cases:
          - 'DateAdd("d", 1, 3000000)'
          - 'DateAdd("d", 0, 2958466)'
          - 'DateAdd("d", 0, -657435)'
      - error: 13
        when: "*date* is a string that is not a date"
        cases:
          - 'DateAdd("d", 1, "abc")'
      - error: 94
        when: "*interval* or *number* is **Null**"
        cases:
          - 'DateAdd(Null, 1, #1/1/2000#)'
          - 'DateAdd("d", Null, #1/1/2000#)'
          - 'DateAdd("d", Null, Null)'
    quiet:
      - 'DateAdd("D", 1, #1/1/2000#)'
      - 'DateAdd("d", 1, Null)'
      - 'DateAdd("x", 1, Null)'
      - 'DateAdd("d", 1, Empty)'
      - 'DateAdd("d", 1, "1/1/2000")'
      - 'DateAdd("d", 1.5, #1/1/2000#)'
      - 'DateAdd("s", 2147483647, #1/1/2000#)'
      - 'DateAdd("yyyy", -1900, #1/1/2000#)'
      - 'DateAdd("d", 0, -657434)'
      - 'DateAdd("d", 1, 2958464)'
