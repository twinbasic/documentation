# The VBA DateTime module. Format: WIP.Errors.md.
#
# Setting Date, Date$, Time or Time$ to a value they accept changes the system clock.
# The probe runs without the privilege to do that, so such a case raises 70; the cases
# set the clock to what it already holds (Date = Date), so a run with the privilege
# changes nothing.
beta: 1010
pages:
  Reference/Default/VBA/DateTime/Calendar.md:
    rows:
      - error: -2147467259
        when: "*calendartype* is **vbCalGreg** or **vbCalHijri**"
        vb6: 0
        bug: calendar-set-unspecified-error
        cases:
          - { run: Calendar = vbCalGreg }
          - { run: "Calendar = vbCalHijri\nCalendar = vbCalGreg" }
          - { run: "Calendar = \"1\"\nCalendar = vbCalGreg" }
      - error: -2147467259
        when: "*calendartype* is any other value"
        vb6: 5
        bug: calendar-set-unspecified-error
        cases:
          - { run: Calendar = 2 }
          - { run: Calendar = -1 }
          - { run: Calendar = 255 }
      - error: 94
        when: "*calendartype* is **Null**"
        cases:
          - { run: Calendar = Null }
    quiet:
      - Calendar
  Reference/Default/VBA/DateTime/Date.md:
    rows:
      - error: 13
        when: "**Date** is given a string that is not a date, or a number outside the range of dates"
        cases:
          - { run: 'Date = "abc"' }
          - { run: 'Date = "February 30, 2020"' }
          - { run: Date = 3000000 }
          - { run: Date = -700000 }
      - error: -2147467259
        when: "**Date$** is given a value that is not a string of the form *mm-dd-yyyy*"
        vb6: 5
        bug: date-time-set-errors
        cases:
          - { run: 'Date$ = "abc"' }
          - { run: 'Date$ = ""' }
          - { run: 'Date$ = "2000-01-01"' }
          - { run: 'Date$ = "January 1, 2000"' }
          - { run: Date$ = 36526 }
          - { run: Date$ = Empty }
      - error: 70
        when: "the process does not have the privilege to change the system date"
        cases:
          - { run: Date = Date }
          - { run: Date$ = Date$ }
      - error: 94
        when: "**Date$** is given **Null**"
        cases:
          - { run: Date$ = Null }
      - error: 94
        when: "**Date** is given **Null**"
        vb6: 13
        bug: date-time-set-errors
        cases:
          - { run: Date = Null }
    quiet:
      - Date
      - Date$
  Reference/Default/VBA/DateTime/Time.md:
    rows:
      - error: 13
        when: "**Time** is given a string that is not a time, or a number outside the range of dates"
        cases:
          - { run: 'Time = "abc"' }
          - { run: 'Time = "25:00"' }
          - { run: Time = 3000000 }
      - error: -2147467259
        when: "**Time$** is given a value that is not a string of the form *hh:mm:ss*, or one outside 00:00:00 to 23:59:59"
        vb6: 5
        bug: date-time-set-errors
        cases:
          - { run: 'Time$ = "abc"' }
          - { run: 'Time$ = ""' }
          - { run: 'Time$ = "25:00"' }
          - { run: 'Time$ = "24:00:00"' }
          - { run: 'Time$ = "10:60"' }
          - { run: 'Time$ = "10:00 PM"' }
          - { run: Time$ = 0.5 }
          - { run: Time$ = Empty }
      - error: 70
        when: "the process does not have the privilege to change the system time"
        cases:
          - { run: Time = Time }
          - { run: Time$ = Time$ }
      - error: 94
        when: "**Time$** is given **Null**"
        cases:
          - { run: Time$ = Null }
      - error: 94
        when: "**Time** is given **Null**"
        vb6: 13
        bug: date-time-set-errors
        cases:
          - { run: Time = Null }
    quiet:
      - Time
      - Time$
  Reference/Default/VBA/DateTime/DateAdd.md:
    rows:
      - error: 5
        when: "*interval* is not one of the settings listed"
        cases:
          - 'DateAdd("x", 1, #1/1/2000#)'
          - 'DateAdd("", 1, #1/1/2000#)'
          - 'DateAdd("dd", 1, #1/1/2000#)'
          - 'DateAdd(" d", 1, #1/1/2000#)'
          - 'DateAdd(1, 1, #1/1/2000#)'
      - error: 5
        when: 'the result would be after December 31, 9999, or before January 1, 100 for an *interval* other than "yyyy", "q" or "m"'
        cases:
          - 'DateAdd("d", 1, #12/31/9999#)'
          - 'DateAdd("s", 1, #12/31/9999 11:59:59 PM#)'
          - 'DateAdd("n", 1, #12/31/9999 11:59:00 PM#)'
          - 'DateAdd("h", 1, #12/31/9999 11:00:00 PM#)'
          - 'DateAdd("y", 1, #12/31/9999#)'
          - 'DateAdd("w", 1, #12/31/9999#)'
          - 'DateAdd("ww", 1, #12/30/9999#)'
          - 'DateAdd("m", 1, #12/1/9999#)'
          - 'DateAdd("q", 1, #11/1/9999#)'
          - 'DateAdd("yyyy", 1, #1/1/9999#)'
          - 'DateAdd("d", 2147483647, #1/1/2000#)'
          - 'DateAdd("d", -1, #1/1/100#)'
          - 'DateAdd("h", -1, #1/1/100#)'
          - 'DateAdd("ww", -1, #1/5/100#)'
          - 'DateAdd("yyyy", -10000, #1/1/2000#)'
      - error: 0
        when: 'the result with an *interval* of "yyyy", "q" or "m" would be before January 1, 100'
        vb6: 5
        bug: dateadd-year-below-100
        cases:
          - 'DateAdd("yyyy", -1, #1/1/100#)'
          - 'DateAdd("yyyy", -1901, #1/1/2000#)'
          - 'DateAdd("q", -1, #1/1/100#)'
          - 'DateAdd("m", -1, #1/1/100#)'
      - error: 6
        when: "*date* is a number outside the range of dates"
        vb6: 13
        bug: dateadd-date-out-of-range-overflow
        cases:
          - 'DateAdd("d", 1, 3000000)'
          - 'DateAdd("d", 0, 2958466)'
          - 'DateAdd("d", 0, -657435)'
      - error: 13
        when: "*date* is a string that is not a date"
        cases:
          - 'DateAdd("d", 1, "abc")'
      - error: 94
        when: "*interval* or *number* is **Null**"
        cases:
          - 'DateAdd(Null, 1, #1/1/2000#)'
          - 'DateAdd("d", Null, #1/1/2000#)'
          - 'DateAdd("d", Null, Null)'
    quiet:
      - 'DateAdd("D", 1, #1/1/2000#)'
      - 'DateAdd("d", 1, Null)'
      - 'DateAdd("x", 1, Null)'
      - 'DateAdd("d", 1, Empty)'
      - 'DateAdd("d", 1, "1/1/2000")'
      - 'DateAdd("d", 1.5, #1/1/2000#)'
      - 'DateAdd("s", 2147483647, #1/1/2000#)'
      - 'DateAdd("yyyy", -1900, #1/1/2000#)'
      - 'DateAdd("d", 0, -657434)'
      - 'DateAdd("d", 1, 2958464)'
  Reference/Default/VBA/DateTime/DateDiff.md:
    rows:
      - error: 5
        when: "*interval* is not one of the settings listed"
        cases:
          - 'DateDiff("x", #1/1/2000#, #1/1/2001#)'
          - 'DateDiff("", #1/1/2000#, #1/1/2001#)'
      - error: 0
        when: '*interval* is "ww" and *firstdayofweek* is outside 0 to 7'
        vb6: 5
        bug: pending
        cases:
          - 'DateDiff("ww", #1/1/2000#, #1/1/2001#, 8)'
          - 'DateDiff("ww", #1/1/2000#, #1/1/2001#, -1)'
          - 'DateDiff("ww", #1/1/2000#, #1/1/2001#, 255)'
      - error: 6
        when: "*date1* or *date2* is a number outside the range of dates"
        vb6: 13
        bug: dateadd-date-out-of-range-overflow
        cases:
          - 'DateDiff("d", #1/1/2000#, 3000000)'
          - 'DateDiff("d", -700000, #1/1/2001#)'
          - 'DateDiff("d", 2958466, #1/1/2001#)'
      - error: 13
        when: "*date1* or *date2* is a string that is not a date"
        cases:
          - 'DateDiff("d", "abc", #1/1/2001#)'
      - error: 94
        when: "*interval*, *firstdayofweek* or *firstweekofyear* is **Null**"
        cases:
          - 'DateDiff(Null, #1/1/2000#, #1/1/2001#)'
          - 'DateDiff("d", #1/1/2000#, #1/1/2001#, Null)'
          - 'DateDiff("d", #1/1/2000#, #1/1/2001#, 1, Null)'
    quiet:
      - 'DateDiff("d", Null, #1/1/2001#)'
      - 'DateDiff("d", #1/1/2000#, Null)'
      - 'DateDiff("x", Null, #1/1/2001#)'
      - 'DateDiff("ww", Null, #1/1/2001#, 8)'
      - 'DateDiff("d", #1/1/2000#, #1/1/2001#, 8)'
      - 'DateDiff("w", #1/1/2000#, #1/1/2001#, 8)'
      - 'DateDiff("ww", #1/1/2000#, #1/1/2001#, 0)'
      - 'DateDiff("ww", #1/1/2000#, #1/1/2001#, 7)'
      - 'DateDiff("ww", #1/1/2000#, #1/1/2001#, 1, 4)'
      - 'DateDiff("ww", #1/1/2000#, #1/1/2001#, 1, -1)'
      - 'DateDiff("s", #1/1/100#, #12/31/9999#)'
      - 'DateDiff("s", #12/31/9999#, #1/1/100#)'
  Reference/Default/VBA/DateTime/DatePart.md:
    rows:
      - error: 5
        when: "*interval* is not one of the settings listed and *date* is not **Null**"
        cases:
          - 'DatePart("x", #1/1/2000#)'
          - 'DatePart("", #1/1/2000#)'
      - error: 5
        when: "*interval* is not one of the settings listed and *date* is **Null**"
        vb6: 0
        bug: datepart-null-checks-interval
        cases:
          - 'DatePart("x", Null)'
      - error: 0
        when: '*interval* is "w" or "ww" and *firstdayofweek* is outside 0 to 7, or *interval* is "ww" and *firstweekofyear* is outside 0 to 3'
        vb6: 5
        bug: pending
        cases:
          - 'DatePart("w", #1/1/2000#, 8)'
          - 'DatePart("w", #1/1/2000#, -1)'
          - 'DatePart("ww", #1/1/2000#, 8)'
          - 'DatePart("ww", #1/1/2000#, -1)'
          - 'DatePart("ww", #1/1/2000#, 1, 4)'
          - 'DatePart("ww", #1/1/2000#, 1, -1)'
      - error: 13
        when: "*date* is a string that is not a date, or a number outside the range of dates"
        cases:
          - 'DatePart("d", "abc")'
          - 'DatePart("d", 3000000)'
          - 'DatePart("d", -700000)'
      - error: 94
        when: "*interval*, *firstdayofweek* or *firstweekofyear* is **Null**"
        cases:
          - 'DatePart(Null, #1/1/2000#)'
          - 'DatePart("d", #1/1/2000#, Null)'
          - 'DatePart("d", #1/1/2000#, 1, Null)'
    quiet:
      - 'DatePart("d", Null)'
      - 'DatePart("ww", Null, 8)'
      - 'DatePart("d", #1/1/2000#, 8)'
      - 'DatePart("yyyy", #1/1/2000#, 8)'
      - 'DatePart("ww", #1/1/2000#, 0)'
      - 'DatePart("w", #1/1/2000#, 7)'
      - 'DatePart("d", #1/1/2000#, 1, 4)'
      - 'DatePart("w", #1/1/2000#, 1, 4)'
      - 'DatePart("ww", #1/1/2000#, 1, 0)'
      - 'DatePart("ww", #1/1/2000#, 1, 3)'
      - 'DatePart("ww", #12/31/9999#, 1, 2)'
      - 'DatePart("ww", #12/31/9999#, 1, 3)'
      - 'DatePart("ww", #1/1/100#, 1, 2)'
      - 'DatePart("ww", #1/8/100#, 1, 3)'
