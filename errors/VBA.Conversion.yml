# The VBA Conversion module. Format: WIP.Errors.md.
beta: 1010
pages:
  Reference/Default/VBA/Conversion/Bin.md:
    rows:
      - error: 6
        when: "*number* is outside the range of a **LongLong**, or is a **Single** or **Double** less than -4,611,686,018,427,387,904 or greater than 4,611,686,018,427,387,903"
        cases:
          - { expr: Bin(1E+20), only: tb }
          - { expr: 'Bin("9223372036854775808")', only: tb }
          - { decl: Dim D As Variant, setup: 'D = CDec("9223372036854775808")', expr: Bin(D), only: tb }
          - { decl: Dim X As Double, setup: X = 2 ^ 62, expr: Bin(X), only: tb }
          - { decl: Dim X As Double, setup: X = -(2 ^ 62) - 1024, expr: Bin(X), only: tb }
          - { decl: Dim S As Single, setup: S = 4.7E+18, expr: Bin(S), only: tb }
      - error: 13
        when: "*number* is a string that does not hold a number (a zero-length string, and one with the `&B` prefix, included)"
        cases:
          - { expr: 'Bin("abc")', only: tb }
          - { expr: 'Bin("")', only: tb }
          - { expr: 'Bin("&B101")', only: tb }
      - error: 94
        when: "**Bin$** is given a *number* that is **Null**"
        cases:
          - { expr: Bin$(Null), only: tb }
    quiet:
      - { expr: Bin(Null), only: tb }
      - { expr: Bin(Empty), only: tb }
      - { expr: 'Bin("&HFF")', only: tb }
      - { expr: 'Bin("9223372036854775807")', only: tb }
      - { decl: Dim D As Variant, setup: 'D = CDec("9223372036854775807")', expr: Bin(D), only: tb }
      - { decl: Dim L As LongLong, setup: L = 9223372036854775807^, expr: Bin(L), only: tb }
      - { decl: Dim X As Double, setup: X = 2 ^ 62 - 1024, expr: Bin(X), only: tb }
      - { decl: Dim X As Double, setup: X = -(2 ^ 62), expr: Bin(X), only: tb }
