# The VBA FileSystem module. Format: WIP.Errors.md. Every case runs under the files harness, in a
# folder of its own that is the current directory: a.txt (10 bytes), empty.txt, ro.txt
# (read-only), hid.txt (hidden), the empty folder sub, and full, which holds f.txt.
beta: 1010
pages:
  Reference/Default/VBA/FileSystem/ChDir.md:
    harness: files
    rows:
      - error: -2147467259
        when: "*path* names no folder that exists, which includes a file, a drive that does not exist, a zero-length string, and a name with a wildcard or a character a name cannot hold"
        vb6: 76
        bug: file-errors-unspecified
        cases:
          - { run: 'ChDir "nosuch"' }
          - { run: 'ChDir "nosub\deeper"' }
          - { run: 'ChDir ""' }
          - { run: 'ChDir " "' }
          - { run: 'ChDir "a.txt"' }
          - { run: 'ChDir files_NoDrive & ":\"' }
          - { run: 'ChDir files_NoDrive & ":\x"' }
          - { run: 'ChDir String(300, "a")' }
          - { run: 'ChDir "*"' }
          - { run: 'ChDir "su?"' }
          - { run: 'ChDir "a<b"' }
          - { run: 'ChDir 5' }
      - error: 94
        when: "*path* is **Null**"
        cases:
          - { run: 'ChDir Null' }
    quiet:
      - { run: 'ChDir "sub": files_Expect CurDir$ = files_Dir & "\sub"' }
      - { run: 'ChDir "sub\": files_Expect CurDir$ = files_Dir & "\sub"' }
      - { run: 'ChDir "..": files_Expect CurDir$ <> files_Dir' }
      - { run: 'ChDir files_Dir & "\full": files_Expect CurDir$ = files_Dir & "\full"' }
  Reference/Default/VBA/FileSystem/ChDrive.md:
    harness: files
    rows:
      - error: -2147467259
        when: "*drive* starts with a letter that no drive has"
        vb6: 68
        bug: file-errors-unspecified
        cases:
          - { run: 'ChDrive files_NoDrive' }
          - { run: 'ChDrive files_NoDrive & ":\"' }
      - error: -2147467259
        when: "*drive* starts with a digit, a space or a punctuation character"
        vb6: 5
        bug: file-errors-unspecified
        cases:
          - { run: 'ChDrive "1"' }
          - { run: 'ChDrive " "' }
          - { run: 'ChDrive "?"' }
          - { run: 'ChDrive "\"' }
          - { run: 'ChDrive "@"' }
          - { run: 'ChDrive "["' }
          - { run: 'ChDrive 5' }
      - error: 94
        when: "*drive* is **Null**"
        cases:
          - { run: 'ChDrive Null' }
    quiet:
      - { run: 'ChDrive ""' }
      - { run: 'ChDrive Empty' }
      - { run: 'ChDrive Left$(files_Dir, 1)' }
      - { run: 'ChDrive LCase$(Left$(files_Dir, 1))' }
      - { run: 'ChDrive Left$(files_Dir, 1) & "xyz"' }
      - { run: 'ChDrive Left$(files_Dir, 3)' }
  Reference/Default/VBA/FileSystem/CurDir.md:
    harness: files
    rows:
      - error: -2147467259
        when: "*drive* starts with a letter that no drive has"
        vb6: 68
        bug: file-errors-unspecified
        cases:
          - CurDir(files_NoDrive)
          - CurDir$(files_NoDrive)
      - error: -2147467259
        when: "*drive* starts with a digit, a space or a punctuation character"
        vb6: 5
        bug: file-errors-unspecified
        cases:
          - CurDir("1")
          - CurDir(" ")
          - CurDir("?")
          - CurDir("@")
          - CurDir$("1")
          - { expr: CurDir(5), only: tb }
      - error: 94
        when: "*drive* is **Null**"
        vb6: 13
        bug: filesystem-argument-checks
        cases:
          - CurDir(Null)
          - CurDir$(Null)
    quiet:
      - CurDir
      - CurDir("")
      - CurDir$
      - CurDir$("")
      - CurDir(Left$(files_Dir, 1))
      - CurDir(LCase$(Left$(files_Dir, 1)) & "xyz")
      - { decl: Dim S As String, setup: 'S = Left$(files_Dir, 1)', expr: CurDir(S) }
      - { decl: Dim V As Variant, setup: 'V = Left$(files_Dir, 1)', expr: CurDir(V) }
      - { run: 'files_Expect CurDir = files_Dir' }
  Reference/Default/VBA/FileSystem/Dir.md:
    harness: files
    rows:
      - error: -2147467259
        when: "**Dir** is called without *pathname* after it has returned a zero-length string"
        vb6: 5
        bug: file-errors-unspecified
        cases:
          - { setup: 'Result = Dir("nosuch.txt")', expr: Dir() }
          - { setup: 'Result = Dir("nosuch.txt")', expr: Dir }
          - { setup: 'Result = Dir("a.txt")', run: 'Result = Dir(): Result = Dir()' }
      - error: -2147467259
        when: "*pathname* names a file and ends in a backslash"
        vb6: 52
        bug: file-errors-unspecified
        cases:
          - Dir("a.txt\")
      - error: -2147467259
        when: "a name in *pathname* is longer than 255 characters"
        vb6: 53
        bug: file-errors-unspecified
        cases:
          - Dir(String(256, "a"))
          - Dir(String(300, "a"))
      - error: 94
        when: "*pathname* is **Null**"
        vb6: 13
        bug: filesystem-argument-checks
        cases:
          - Dir(Null)
          - 'Dir(Null, 0)'
      - error: 94
        when: "*attributes* is **Null**"
        cases:
          - 'Dir("a.txt", Null)'
    quiet:
      - { run: 'files_Expect Dir("a.txt") = "a.txt"' }
      - { run: 'files_Expect Dir("nosuch.txt") = ""' }
      - { setup: 'Result = Dir("a.txt")', run: 'files_Expect Dir() = ""' }
      - Dir("")
      - 'Dir("", 8)'
      - 'Dir("*.txt", 8)'
      - 'Dir("*", 16)'
      - 'Dir("*", 32)'
      - 'Dir("*", 63)'
      - Dir("nosub\*")
      - Dir(files_NoDrive & ":\*")
      - Dir("a<b")
      - Dir("sub")
      - 'Dir("sub", 16)'
      - Dir(files_Dir & "\")
      - Dir("sub\")
      - { run: 'files_Expect Dir("hid.txt") = ""' }
      - { run: 'files_Expect Dir("hid.txt", 2) = "hid.txt"' }
      - { run: 'files_Expect Dir("*", -1) = Dir("*", 23)', only: tb }
      - { run: 'files_Expect Dir("*", 64) = Dir("*", 0)', only: tb }
      - { run: 'files_Expect Dir("h*", -1) = "hid.txt"', only: tb }
      - { expr: 'Dir("*", 128)', only: tb }
      - { expr: 'Dir("*", 256)', only: tb }
      - { expr: 'Dir("*", 1024)', only: tb }
      - { expr: 'Dir("*", 2147483647)', only: tb }
      - { setup: 'MkDir "5"', run: 'files_Expect Dir(5, 16) = "5"', only: tb }
      - { expr: Dir(True), only: tb }
      - { expr: Dir(5.5), only: tb }
  Reference/Default/VBA/FileSystem/EOF.md:
    harness: files
    rows:
      - error: -2147467259
        when: "*filenumber* is not the number of an open file"
        vb6: 52
        bug: file-errors-unspecified
        cases:
          - EOF(99)
          - EOF(0)
          - EOF(-1)
          - EOF(256)
          - EOF(512)
          - { setup: 'Open "a.txt" For Input As #1', run: "Close #1\nResult = EOF(1)" }
      - error: 94
        when: "*filenumber* is **Null**"
        cases:
          - EOF(Null)
    quiet:
      - { setup: 'Open "a.txt" For Input As #1', run: 'files_Expect Not EOF(1)' }
      - { setup: 'Open "empty.txt" For Input As #1', run: 'files_Expect EOF(1)' }
      - { setup: 'Open "a.txt" For Output As #1', expr: EOF(1) }
      - { setup: 'Open "a.txt" For Append As #1', expr: EOF(1) }
      - { setup: 'Open "a.txt" For Binary As #1', expr: EOF(1) }
      - { setup: 'Open "a.txt" For Random As #1 Len = 4', expr: EOF(1) }
      - { setup: 'Open "a.txt" For Input As #300', expr: EOF(300) }
  Reference/Default/VBA/FileSystem/FileAttr.md:
    harness: files
    rows:
      - error: -2147467259
        when: "*filenumber* is not the number of an open file"
        vb6: 52
        bug: file-errors-unspecified
        cases:
          - 'FileAttr(99, 1)'
          - 'FileAttr(0, 1)'
          - 'FileAttr(99, 0)'
      - error: -2147467259
        when: "*returntype* is not 1, after rounding"
        vb6: 5
        bug: file-errors-unspecified
        cases:
          - { setup: 'Open "a.txt" For Input As #1', expr: 'FileAttr(1, 2)' }
          - { setup: 'Open "a.txt" For Input As #1', expr: 'FileAttr(1, 0)' }
          - { setup: 'Open "a.txt" For Input As #1', expr: 'FileAttr(1, 3)' }
          - { setup: 'Open "a.txt" For Input As #1', expr: 'FileAttr(1, -1)' }
          - { setup: 'Open "a.txt" For Input As #1', expr: 'FileAttr(1, 1.6)' }
      - error: 94
        when: "*filenumber* or *returntype* is **Null**"
        cases:
          - 'FileAttr(Null, 1)'
          - { setup: 'Open "a.txt" For Input As #1', expr: 'FileAttr(1, Null)' }
    quiet:
      - { setup: 'Open "a.txt" For Input As #1', run: 'files_Expect FileAttr(1, 1) = 1' }
      - { setup: 'Open "a.txt" For Input As #1', run: 'files_Expect FileAttr(1, 1.4) = 1' }
      - { setup: 'Open "a.txt" For Output As #1', run: 'files_Expect FileAttr(1, 1) = 2' }
      - { setup: 'Open "a.txt" For Random As #1', run: 'files_Expect FileAttr(1, 1) = 4' }
      - { setup: 'Open "a.txt" For Append As #1', run: 'files_Expect FileAttr(1, 1) = 8' }
      - { setup: 'Open "a.txt" For Binary As #1', run: 'files_Expect FileAttr(1, 1) = 32' }
  Reference/Default/VBA/FileSystem/FileCopy.md:
    harness: files
    rows:
      - error: 53
        when: "*source* does not exist"
        cases:
          - { run: 'FileCopy "nosuch.txt", "b.txt"' }
      - error: 76
        when: "the folder or drive named in *source* or *destination* does not exist, or *destination* ends in a backslash"
        cases:
          - { run: 'FileCopy "nosub\a.txt", "b.txt"' }
          - { run: 'FileCopy "a.txt", "nosub\b.txt"' }
          - { run: 'FileCopy files_NoDrive & ":\a.txt", "b.txt"' }
          - { run: 'FileCopy "a.txt", files_NoDrive & ":\a.txt"' }
          - { run: 'FileCopy "a.txt", "sub\"' }
      - error: 55
        when: "*source* is open with write access or locked against reading, or *destination* is open"
        cases:
          - { setup: 'Open "a.txt" For Binary Access Read Lock Read Write As #1', run: 'FileCopy "a.txt", "b.txt"' }
          - { setup: 'Open "a.txt" For Append As #1', run: 'FileCopy "a.txt", "b.txt"' }
          - { setup: 'Open "a.txt" For Output As #1', run: 'FileCopy "a.txt", "b.txt"' }
          - { setup: 'Open "a.txt" For Binary As #1', run: 'FileCopy "a.txt", "b.txt"' }
          - { setup: 'Open "a.txt" For Random As #1', run: 'FileCopy "a.txt", "b.txt"' }
          - { setup: 'Open "a.txt" For Binary Access Write As #1', run: 'FileCopy "a.txt", "b.txt"' }
          - { setup: 'Open "a.txt" For Binary Access Read Write As #1', run: 'FileCopy "a.txt", "b.txt"' }
          - { setup: 'Open "b.txt" For Output As #1', run: 'FileCopy "a.txt", "b.txt"' }
          - { setup: 'Open "empty.txt" For Input As #1', run: 'FileCopy "a.txt", "empty.txt"' }
          - { setup: 'Open "empty.txt" For Binary Access Read As #1', run: 'FileCopy "a.txt", "empty.txt"' }
      - error: 55
        when: "*destination* names the same file as *source*"
        vb6: 70
        bug: filecopy-error-numbers
        cases:
          - { run: 'FileCopy "a.txt", "a.txt"' }
          - { run: 'FileCopy "a.txt", "A.TXT"' }
          - { run: 'FileCopy "a.txt", ".\a.txt"' }
      - error: 55
        when: "*source* is open **For Input** with **Lock Read**"
        vb6: 70
        bug: filecopy-error-numbers
        cases:
          - { setup: 'Open "a.txt" For Input Lock Read As #1', run: 'FileCopy "a.txt", "b.txt"' }
      - error: 70
        when: "*source* is a folder, or *destination* is a folder or a read-only or hidden file"
        vb6: 75
        bug: filecopy-error-numbers
        cases:
          - { run: 'FileCopy "sub", "b.txt"' }
          - { run: 'FileCopy "full", "b.txt"' }
          - { run: 'FileCopy "a.txt", "sub"' }
          - { run: 'FileCopy "a.txt", "ro.txt"' }
          - { run: 'FileCopy "a.txt", "hid.txt"' }
      - error: -2147467259
        when: "*source* or *destination* is a zero-length string"
        vb6: 75
        bug: file-errors-unspecified
        cases:
          - { run: 'FileCopy "", "b.txt"' }
          - { run: 'FileCopy "a.txt", ""' }
      - error: -2147467259
        when: "*source* or *destination* holds a wildcard or a character a file name cannot hold"
        vb6: 52
        bug: file-errors-unspecified
        cases:
          - { run: 'FileCopy "*.txt", "b.txt"' }
          - { run: 'FileCopy "a.tx?", "b.txt"' }
          - { run: 'FileCopy "a.txt", "b*.txt"' }
          - { run: 'FileCopy "a.txt", "a<b"' }
      - error: 94
        when: "*source* or *destination* is **Null**"
        cases:
          - { run: 'FileCopy Null, "b.txt"' }
          - { run: 'FileCopy "a.txt", Null' }
    quiet:
      - { run: 'FileCopy "a.txt", "b.txt": files_Expect FileLen("b.txt") = 10' }
      - { run: 'FileCopy "a.txt", "sub\b.txt": files_Expect FileLen("sub\b.txt") = 10' }
      - { run: 'FileCopy "a.txt", "empty.txt": files_Expect FileLen("empty.txt") = 10' }
      - { run: 'FileCopy "ro.txt", "b.txt": files_Expect FileLen("b.txt") = 1' }
      - { run: 'FileCopy "a.txt", "ro.txt": Err.Clear: files_Expect FileLen("ro.txt") = 1' }
      - { setup: 'Open "a.txt" For Input As #1', run: 'FileCopy "a.txt", "b.txt": files_Expect FileLen("b.txt") = 10' }
      - { setup: 'Open "a.txt" For Input Shared As #1', run: 'FileCopy "a.txt", "b.txt"' }
      - { setup: 'Open "a.txt" For Binary Access Read As #1', run: 'FileCopy "a.txt", "b.txt": files_Expect FileLen("b.txt") = 10', only: tb }
      - { setup: 'Open "a.txt" For Binary Access Read Shared As #1', run: 'FileCopy "a.txt", "b.txt"', only: tb }
      - { setup: 'Open "a.txt" For Random Access Read As #1', run: 'FileCopy "a.txt", "b.txt"', only: tb }
      - { setup: 'Open "a.txt" For Binary Access Read Lock Write As #1', run: 'FileCopy "a.txt", "b.txt"', only: tb }
