          - String(Null, "a")
          - String$(Null, "a")
          - String$(3, Null)
      - error: 94
        when: "**String** is given a *character* that is **Null**"
        vb6: 0
        bug: string-null-character
        cases:
          - String(3, Null)
    quiet:
      - String(0, "a")
      - String(3, "abc")
      - String(3, 65)
      - String(3, 256)
      - String(3, -1)
  Reference/Default/VBA/Strings/Trim.md:
    rows:
      - error: 94
        when: "**Trim$** is given a *string* that is **Null**"
        cases: [Trim$(Null)]
    quiet: [Trim(Null)]
  Reference/Default/VBA/Strings/UCase.md:
    rows:
      - error: 94
        when: "**UCase$** is given a *string* that is **Null**"
        cases: [UCase$(Null)]
    quiet: [UCase(Null)]
  Reference/Default/VBA/Strings/WeekdayName.md:
    rows:
      - error: 5
        when: "*weekday* is less than 1 or greater than 7, or *firstdayofweek* is less than 0 or greater than 7"
        cases:
          - WeekdayName(0)
          - WeekdayName(8)
          - WeekdayName(1, False, -1)
          - WeekdayName(1, False, 8)
      - error: 94
        when: "any argument is **Null**"
        cases:
          - WeekdayName(Null)
          - WeekdayName(1, Null)
          - WeekdayName(1, False, Null)
    quiet:
      - WeekdayName(7, False, 0)
      - WeekdayName(1, 2)
