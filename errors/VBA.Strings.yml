      - FormatPercent(1, 2, -2, -2, -2)
  Reference/Default/VBA/Strings/Join.md:
    rows:
      - error: 5
        when: "*sourcearray* has more than one dimension"
        cases:
          - decl: Dim A(1, 1) As String
            expr: Join(A)
      - error: 13
        when: "*sourcearray* is **Null**, or an element of it is an array"
        cases:
          - Join(Null)
          - Join(Array(Array(1)))
      - error: 94
        when: "*delimiter* is **Null**, or an element of *sourcearray* is **Null**"
        cases:
          - Join(Array("a", "b"), Null)
          - Join(Array("a", Null))
    quiet:
      - Join(Array(1, 2))
      - Join(Array())
      - decl: Dim A(1) As Long
        expr: Join(A)
        only: tb
      - decl: Dim A(1) As Double
        expr: Join(A)
        only: tb
      - decl: Dim A() As String
        expr: Join(A)
  Reference/Default/VBA/Strings/LCase.md:
    rows:
      - error: 94
        when: "**LCase$** is given a *string* that is **Null**"
        cases: [LCase$(Null)]
    quiet: [LCase(Null), LCase(1)]
  Reference/Default/VBA/Strings/LTrim.md:
    rows:
      - error: 94
        when: "**LTrim$** is given a *string* that is **Null**"
        cases: [LTrim$(Null)]
    quiet: [LTrim(Null)]
  Reference/Default/VBA/Strings/MonthName.md:
    rows:
      - error: 5
        when: "*month* is less than 1 or greater than 12"
        cases: [MonthName(0), MonthName(13), MonthName(-1)]
      - error: 94
        when: "*month* or *abbreviate* is **Null**"
        cases:
          - MonthName(Null)
          - MonthName(1, Null)
    quiet:
      - MonthName(12, True)
      - MonthName(1, 2)
  Reference/Default/VBA/Strings/Replace.md:
    rows:
      - error: 5
        when: "*start* is less than 1, or *count* is less than -1"
        cases:
          - Replace("abc", "a", "b", 0)
          - Replace("abc", "a", "b", -1)
          - Replace("abc", "a", "b", 1, -2)
      - error: 5
        when: "*compare* is less than 0, or greater than 1 and not a valid locale identifier"
        cases:
          - Replace("abc", "a", "b", 1, -1, -1)
          - Replace("abc", "a", "b", 1, -1, -2)
          - Replace("abc", "a", "b", 1, -1, 99999)
          - Replace("", "a", "b", 1, -1, 99999)
      - error: 94
        when: "any argument is **Null**"
        cases:
          - Replace(Null, "a", "b")
          - Replace("abc", Null, "b")
          - Replace("abc", "a", Null)
          - Replace("abc", "a", "b", Null)
          - Replace("abc", "a", "b", 1, Null)
          - Replace("abc", "a", "b", 1, -1, Null)
    quiet:
      - Replace("abc", "a", "b", 5)
      - Replace("abc", "a", "b", 1073741825)
      - Replace("abc", "a", "b", 1, 0)
      - Replace("abc", "a", "b", 1, -1, 2)
      - Replace("abc", "a", "b", 1, -1, 1033)
  Reference/Default/VBA/Strings/RTrim.md:
    rows:
      - error: 94
        when: "**RTrim$** is given a *string* that is **Null**"
        cases: [RTrim$(Null)]
    quiet: [RTrim(Null)]
  Reference/Default/VBA/Strings/Space.md:
    rows:
      - error: 5
        when: "*number* is negative, or greater than 1,073,741,823"
        cases: [Space(-1), Space$(-1), Space(1073741824), Space(2147483647)]
      - error: 94
        when: "*number* is **Null**"
        cases: [Space(Null), Space$(Null)]
    quiet: [Space(0)]
  Reference/Default/VBA/Strings/Split.md:
    rows:
      - error: 5
        when: "*limit* is less than -1"
        cases:
          - Split("a b", " ", -2)
      - error: 5
        when: "*compare* is less than 0, or greater than 1 and not a valid locale identifier"
        cases:
          - Split("a b", " ", -1, -1)
          - Split("a b", " ", -1, -2)
          - Split("a b", " ", -1, 99999)
          - Split("", " ", -1, 99999)
      - error: 94
        when: "any argument is **Null**"
        cases:
          - Split(Null)
          - Split("a b", Null)
          - Split("a b", " ", Null)
          - Split("a b", " ", -1, Null)
    quiet:
      - Split("a b", " ", 0)
      - Split("a b", " ", -1, 2)
      - Split("a b", " ", -1, 1033)
  Reference/Default/VBA/Strings/StrComp.md:
    rows:
      - error: 5
        when: "*compare* is less than 0, or greater than 1 and not a valid locale identifier"
        cases:
          - StrComp("a", "b", -1)
          - StrComp("a", "b", -2)
          - StrComp("a", "b", 99999)
      - error: 0
        when: "*compare* is 2 (**vbDatabaseCompare**)"
        vb6: 5
        bug: database-compare-no-error
        cases:
          - { expr: 'StrComp("a", "b", 2)', only: [tb, vb6] }   # Access gives 2 a meaning of its own
      - error: 94
        when: "*compare* is **Null**"
        cases:
          - StrComp("a", "b", Null)
    quiet:
      - StrComp(Null, "b")
      - StrComp(Null, "b", 99999)
      - StrComp("", "", 99999)
      - StrComp("a", "", 99999)
      - StrComp("a", "b", 1033)
  Reference/Default/VBA/Strings/StrConv.md:
    rows:
      - error: 5
        when: "*conversion* is a value the table does not list, or combines **vbUnicode**, **vbFromUnicode**, **vbUTF8** or **vbFromUTF8** with another value"
        cases:
          - StrConv("a", 64 + 128)
          - StrConv("a", 1 + 64)
          - StrConv("a", 128 + 2)
          - StrConv("a", 1024)
          - StrConv("a", -1)
          - { expr: 'StrConv("a", 256 + 512)', only: tb }
          - { expr: 'StrConv("a", 64 + 256)', only: tb }
      - error: 5
        when: "*conversion* includes **vbWide**, **vbNarrow**, **vbKatakana** or **vbHiragana** on a system whose locale is not East Asian"
        cases:
          - StrConv("a", 4)
          - StrConv("a", 8)
          - StrConv("a", 16)
          - StrConv("a", 32)
      - error: 5
        when: "*conversion* includes **vbWide**, **vbNarrow**, **vbKatakana** or **vbHiragana** and *LCID* names an East Asian locale, on a system whose locale is not East Asian"
        vb6: 0
        bug: strconv-east-asian-lcid
        cases:
          - StrConv("a", 4, 1041)
          - StrConv("a", 16, 1041)
      - error: 5
        when: "*LCID* is not a valid locale identifier"
        cases:
          - StrConv("a", 1, 99999)
          - StrConv("a", 1, -1)
      - error: 94
        when: "*conversion* or *LCID* is **Null**"
        cases:
          - StrConv("a", Null)
          - StrConv("a", 1, Null)
    quiet:
      - StrConv(Null, 1)
      - StrConv("a", 0)
      - StrConv("a", 1 + 2)
      - StrConv("a", 3)
      - StrConv("a", 64)
      - StrConv("a", 128)
      - StrConv("a", 1, 1033)
      - { expr: 'StrConv("a", 256)', only: tb }
      - { expr: 'StrConv("a", 512)', only: tb }
  Reference/Default/VBA/Strings/StrReverse.md:
    rows:
      - error: 94
        when: "*expression* is **Null**"
        cases: [StrReverse(Null)]
    quiet: [StrReverse(""), StrReverse(1)]
  Reference/Default/VBA/Strings/String.md:
    rows:
      - error: 5
        when: "*number* is negative, or greater than 1,073,741,823"
        cases:
          - String(-1, "a")
          - String$(-1, "a")
          - String(1073741824, "a")
          - String(2147483647, "a")
      - error: 5
        when: "*character* is a zero-length string"
