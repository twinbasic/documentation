  Reference/Default/VBA/Financial/NPer.md:
    rows:
      - error: 6
        when: "*rate* and *pmt* are of opposite signs, as in a loan or a savings plan, and a number of periods exists"
        vb6: 0
        bug: nper-opposite-signs-overflow
        cases:
          - NPer(0.01, -100, 1000)
          - NPer(0.05, -100, 1000)
          - NPer(0.01, -200, 1000)
          - NPer(0.1 / 12, -500, 20000)
          - NPer(0.01, -100, 1000, 100)
          - NPer(0.01, -100, 1000, 0, 1)
          - NPer(0.01, -100, 1000, 0, 2)
          - NPer(0.01, -100, 0, 1000)
          - NPer(0.01, -100, -1000)
          - NPer(-0.5, 100, -1000)
      - error: 6
        when: "no number of periods exists, as when *pmt* does not cover the interest, or *rate* is -1 and *pmt* is greater than 0"
        vb6: 5
        bug: nper-opposite-signs-overflow
        cases:
          - NPer(0.01, -1, 1000)
          - NPer(-2, -100, 1000)
          - NPer(-1, 100, -1000)
      - error: 11
        when: "*pmt* is 0 and *rate* is not 0, or *rate* is -1 and *pmt* is less than 0"
        vb6: 5
        bug: nper-opposite-signs-overflow
        cases:
          - NPer(0.01, 0, 1000)
          - NPer(0.01, 0, 0)
          - NPer(-1, -100, 1000)
          - NPer(-1, -100, 1000, 0, 1)
      - error: -2147467259
        when: "*rate* and *pmt* are both 0"
        vb6: 5
        bug: argument-errors-unspecified-error
        cases:
          - NPer(0, 0, 1000)
          - NPer(0, 0, 0)
      - error: 13
        when: "*fv* or *type* is a string that is not a number"
        cases:
          - NPer(0.01, -100, 1000, "abc")
          - NPer(0.01, -100, 1000, 0, "abc")
      - error: 13
        when: "*fv* or *type* is **Null**"
        vb6: 94
        bug: financial-null-optional-argument
        cases:
          - NPer(0.01, -100, 1000, Null)
          - NPer(0.01, -100, 1000, 0, Null)
      - error: 94
        when: "*rate*, *pmt* or *pv* is **Null**"
        cases:
          - NPer(Null, -100, 1000)
          - NPer(0.01, Null, 1000)
          - NPer(0.01, -100, Null)
    quiet:
      - NPer(0.01, 100, 1000)
      - NPer(0.01, 100, -1000)
      - NPer(0.05, 100, -1000)
      - NPer(0.01, 100, -1000, 100)
      - NPer(0.01, 100, -1000, -100)
      - NPer(0.01, 100, -1000, 0, 1)
      - NPer(0.01, 100, -1000, 0, 2)
      - NPer(0.01, 100, 0, -1000)
      - NPer(0, -100, 1000)
      - NPer(-0.5, -100, 1000)
