        vba64: 6
        bug: financial-argument-checks
        cases:
          - PV(-1, -1, -100)
      - error: 11
        when: "the result is beyond the range of a **Double**"
        # An extension (owner, 2026-10-28): as 64-bit VBA; VB6 returns infinity (a NOTE in the prose).
        cases:
          - { expr: 'PV(-0.99999999, 1000, -100)', only: [tb, vba64] }
          - { expr: 'PV(-0.5, 2000, -100)', only: [tb, vba64] }
      - error: 13
        when: "*fv* or *type* is a string that is not a number"
        cases:
          - PV(0.01, 10, -100, "abc")
          - PV(0.01, 10, -100, 0, "abc")
      - error: 13
        when: "*fv* or *type* is **Null**"
        vb6: 94
        bug: financial-null-optional-argument
        cases:
          - PV(0.01, 10, -100, Null)
          - PV(0.01, 10, -100, 0, Null)
      - error: 94
        when: "*rate*, *nper* or *pmt* is **Null**"
        cases:
          - PV(Null, 10, -100)
          - PV(0.01, Null, -100)
          - PV(0.01, 10, Null)
    quiet:
      - PV(0.01, 10, -100)
