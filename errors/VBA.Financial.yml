    rows:
      - error: -2147467259
        when: "*rate* is -1 and *nper* is 0"
        vb6: 0
        bug: financial-argument-checks
        cases:
          - PV(-1, 0, -100)
      - error: -2147467259
        when: "*rate* is -1 and *nper* is greater than 0"
        vb6: 0
        vba64: 11
        bug: financial-argument-checks
