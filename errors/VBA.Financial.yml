  Reference/Default/VBA/Financial/IRR.md:
    rows:
      - error: -2147467259
        when: "*values* has no element less than 0 or none greater than 0, or **IRR** finds no result in 20 tries from *guess* (a *guess* of -1 or less, or far from the result, included)"
        vb6: 5
        bug: argument-errors-unspecified-error
        cases:
          - decl: Dim A(1) As Double
            setup: "A(0) = 100\nA(1) = 110"
            expr: IRR(A)
          - decl: Dim A(1) As Double
            setup: "A(0) = -100\nA(1) = -110"
            expr: IRR(A)
          - decl: Dim A(1) As Double
            expr: IRR(A)
          - decl: Dim A(0) As Double
            setup: A(0) = -100
            expr: IRR(A)
          - decl: Dim A(1) As Double
            setup: "A(0) = -100\nA(1) = 0"
            expr: IRR(A)
          - decl: Dim A(1) As Double
            setup: "A(0) = 0\nA(1) = 110"
            expr: IRR(A)
          - decl: Dim A(1) As Double
            setup: "A(0) = -100\nA(1) = 1E+300"
            expr: IRR(A)
          - decl: Dim A(1) As Double
            setup: "A(0) = -100\nA(1) = 0.0000001"
            expr: IRR(A)
          - decl: Dim A(1) As Double
            setup: "A(0) = -100\nA(1) = 110"
            expr: IRR(A, -1)
          - decl: Dim A(1) As Double
            setup: "A(0) = -100\nA(1) = 110"
            expr: IRR(A, -2)
          - decl: Dim A(1) As Double
            setup: "A(0) = -100\nA(1) = 110"
            expr: IRR(A, 100)
      - error: -2147418113
        when: "*values* has more than one dimension"
        vb6: 5
        bug: financial-array-arguments
        cases:
          - decl: Dim A(1, 1) As Double
            setup: "A(0, 0) = -100\nA(1, 0) = 110\nA(0, 1) = -100\nA(1, 1) = 110"
            expr: IRR(A)
      - error: 13
        when: "*guess* is a string that is not a number"
        cases:
          - decl: Dim A(1) As Double
            setup: "A(0) = -100\nA(1) = 110"
            expr: IRR(A, "abc")
      - error: 94
        when: "*guess* is **Null**"
        cases:
          - decl: Dim A(1) As Double
            setup: "A(0) = -100\nA(1) = 110"
            expr: IRR(A, Null)
    quiet:
      - decl: Dim A(1) As Double
        setup: "A(0) = -100\nA(1) = 110"
        expr: IRR(A)
      - decl: Dim A(2) As Double
        setup: "A(0) = -100\nA(1) = 50\nA(2) = 60"
        expr: IRR(A)
      - decl: Dim A(1) As Double
        setup: "A(0) = 110\nA(1) = -100"
        expr: IRR(A)
      - decl: Dim A(1 To 2) As Double
        setup: "A(1) = -100\nA(2) = 110"
        expr: IRR(A)
      - decl: Dim A(1) As Double
        setup: "A(0) = -100\nA(1) = 110"
        expr: IRR(A, 0)
      - decl: Dim A(1) As Double
        setup: "A(0) = -100\nA(1) = 110"
        expr: IRR(A, -0.99)
      - decl: Dim A(1) As Double
        setup: "A(0) = -100\nA(1) = 110"
        expr: IRR(A, Empty)
