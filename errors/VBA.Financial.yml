# The VBA Financial module. Format: WIP.Errors.md.
beta: 1010
pages:
  Reference/Default/VBA/Financial/DDB.md:
    rows:
      - error: -2147467259
        when: "*life* is 0 or less, *period* is 0 or less or greater than *life*, *salvage* is less than 0, or *factor* is 0 or less (**Empty** and **True** included)"
        vb6: 5
        bug: argument-errors-unspecified-error
        cases:
          - DDB(1000, 100, 0, 1)
          - DDB(1000, 100, -5, 1)
          - DDB(1000, 100, 5, 0)
          - DDB(1000, 100, 5, -1)
          - DDB(1000, 100, 5, 5.0000001)
          - DDB(1000, 100, 5, 6)
          - DDB(1000, -100, 5, 1)
          - DDB(1000, 100, 5, 1, 0)
          - DDB(1000, 100, 5, 1, -1)
          - DDB(1000, 100, 5, 1, Empty)
          - DDB(1000, 100, 5, 1, True)
      - error: -2147467259
        when: "*life* is greater than 0 and less than 1"
        vb6: 0
        bug: financial-argument-checks
        cases:
          - DDB(1000, 100, 0.5, 0.5)
          - DDB(1000, 100, 0.9, 0.9)
          - DDB(1000, 100, 0.999999, 0.1)
      - error: 13
        when: "*factor* is not a number or a string that holds one"
        cases:
          - DDB(1000, 100, 5, 1, "abc")
          - DDB(1000, 100, 5, 1, CVErr(5))
          - DDB(1000, 100, 5, 1, Array(1))
      - error: 13
        when: "*factor* is **Null**"
        vb6: 94
        bug: financial-null-optional-argument
        cases:
          - DDB(1000, 100, 5, 1, Null)
      - error: 94
        when: "*cost*, *salvage*, *life* or *period* is **Null**"
        cases:
          - DDB(Null, 100, 5, 1)
          - DDB(1000, Null, 5, 1)
          - DDB(1000, 100, Null, 1)
          - DDB(1000, 100, 5, Null)
    quiet:
      - DDB(1000, 100, 5, 1)
      - DDB(1000, 100, 5, 5)
      - DDB(1000, 100, 5, 0.5)
      - DDB(1000, 100, 1, 1)
      - DDB(1000, 100, 1, 0.5)
      - DDB(1000, 100, 1.5, 1)
      - DDB(-1000, 100, 5, 1)
      - DDB(100, 1000, 5, 1)
      - DDB(0, 0, 5, 1)
      - DDB(1000, 100, 5, 1, 1)
      - DDB(1000, 100, 5, 1, 0.5)
      - DDB(1000, 100, 5, 1, 10)
      - DDB(1000, 100, 5, 1, 1E+300)
      - DDB(1000, 100, 5, 1, "3")
  Reference/Default/VBA/Financial/FV.md:
    rows:
      - error: 5
        when: "*rate* is -1 and *nper* is less than 0"
        vb6: 11
        vba64: 6
        bug: financial-argument-checks
        cases:
          - FV(-1, -1, -100)
          - FV(-1, -1, 0)
          - FV(-1, -2, -100)
          - FV(-1, -0.5, -100)
          - FV(-1, -1, -100, 0, 1)
      - error: 6
        when: the result is beyond the range of a **Double**
        cases:
          - FV(10, 1000, -100)
          - FV(1, 2000, -100)
          - FV(-0.5, -2000, -100)
          - FV(1E+300, 2, -100)
      - error: 13
        when: "*pv* or *type* is a string that is not a number, or an error value"
        cases:
          - FV(0.01, 10, -100, "abc")
          - FV(0.01, 10, -100, 0, "abc")
          - FV(0.01, 10, -100, CVErr(5))
      - error: 13
        when: "*pv* or *type* is **Null**"
        vb6: 94
        bug: financial-null-optional-argument
        cases:
          - FV(0.01, 10, -100, Null)
          - FV(0.01, 10, -100, 0, Null)
      - error: 94
        when: "*rate*, *nper* or *pmt* is **Null**"
        cases:
          - FV(Null, 10, -100)
          - FV(0.01, Null, -100)
          - FV(0.01, 10, Null)
    quiet:
      - FV(0.01, 10, -100)
      - FV(0, 10, -100)
      - FV(-1, 10, -100)
      - FV(-2, 10, -100)
      - FV(-1, 0, -100)
      - FV(0.01, 0, -100)
      - FV(0.01, -10, -100)
      - FV(0.01, 10.5, -100)
      - FV(0.01, 10, -100, 1000)
      - FV(0.01, 10, -100, Empty)
      - FV(0.01, 10, -100, "5")
      - FV(0.01, 10, -100, 0, 1)
      - FV(0.01, 10, -100, 0, 2)
      - FV(0.01, 10, -100, 0, -1)
      - FV(0.01, 10, -100, 0, 0.5)
      - FV(0.01, 10, -100, 0, True)
      - FV(0.01, 10, -100, 0, Empty)
      - FV(0.01, 10, -100, 0, "1")
