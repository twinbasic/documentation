title: twinBASIC Documentation
logo: favicon.png
logo_with_title: true
url: "https://docs.twinbasic.com"

# note: redcarpet is not supported on github pages
markdown: kramdown
kramdown:
  parse_block_html: true
  parse_span_html: true
  input: GFM

theme: just-the-docs

highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "*/Images"
    values:
      image: true
  - scope:
      path: "assets/css"
    values:
      # Without this override, the global `layout: default` default
      # above wraps every Liquid-processed .css file in the full page
      # chrome (sidebar, footer, etc.), so the browser sees HTML at
      # `<link rel="stylesheet" href=".../just-the-docs-head-nav.css">`,
      # silently fails to parse, and loses the FOUC-prevention chunk.
      # .scss files in this same folder are unaffected (jekyll-sass-
      # converter bypasses the layout system entirely).
      layout: null
      render_with_liquid: true

# GitHub-style admonitions are supported, but we may wish to add custom
# callouts below.
callouts:
  #tip:
  #  title: 💡 Tip
  #  color: green


#collections:
#  intro:
#    output: true
#  features:
#    output: true
#  samples:
#    output: true
      
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

redirect_from:
  json: false

# For copy button on code
enable_copy_code_button: true

# Waiting until it's needed.
# # By default, consuming the theme as a gem leaves mermaid disabled; it is opt-in
# mermaid:
#   # Version of mermaid library
#   # Pick an available version from https://cdn.jsdelivr.net/npm/mermaid/
#   version: "9.1.6"

# Aux links for the upper right navigation
aux_links:
  "twinBASIC Home":
    - "https://www.twinbasic.com"

# External navigation links
nav_external_links:
  - title: twinBASIC Home
    url: https://www.twinbasic.com

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Copyright &copy; 2025 TWINBASIC LTD (Company No. 16590181, VAT No. GB497509439)'

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%b %e %Y at %I:%M %p" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html

# Footer "Edit this page on GitHub" link text
gh_edit_link: true # show or hide edit this page link
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/twinbasic/documentation/" # the github URL for your repo
gh_edit_branch: "main" # the branch that your docs is served from
gh_edit_source: docs # the source that your files originate from
gh_edit_view_mode: "tree" # "tree" or "edit" if you want the user to jump into the editor immediately

# Footer "Download offline copy" link -- points at the offline-site
# zip attached to the latest GitHub release (cut by the manual
# `workflow_dispatch` path in .github/workflows/jekyll-gh-pages.yml).
# Rendered inside the same flex row as the "Edit this page" link,
# with id="download-offline" on the <a>. Emitted in both the online
# _site/ and the offline _site-offline/ trees -- online readers use
# it to fetch the offline copy, offline readers use it to refresh
# theirs against the latest release.
gh_offline_link: true
gh_offline_link_text: "Download offline copy"
gh_offline_link_url: "https://github.com/twinbasic/documentation/releases/latest/download/twinbasic-docs-offline.zip"

# When true, the Offlinify plugin (_plugins/offlinify.rb) runs at the
# end of the build, copies _site/ to _site-offline/, rewrites every
# URL to a page-relative form, patches a couple of just-the-docs JS
# issues, and wires up the search index to load from a <script src=>
# instead of XHR. The result is a fully self-contained tree that can
# be opened directly off disk in a browser. Adds ~3-5s to the build;
# the online _site/ output is unaffected.
also_build_offline: true

# When true, the Pdfify plugin (_plugins/pdfify.rb) runs at the end of
# the build and emits a sparse _site-pdf/ tree containing only the
# files pagedjs-cli needs: book.html, the two stylesheets the book
# layout links (print.css, rouge.css), and every image referenced
# from book.html. book.bat then renders the PDF from _site-pdf/book.html.
# Adds <1s to the build (it's a few file copies); the online _site/
# output is unaffected.
also_build_pdf: true

# Patterns for files Jekyll produces in _site/ that have no purpose
# in the offline tree -- Pages / crawler metadata, jekyll-redirect-
# from output, Windows batch scripts Jekyll picks up from the source
# directory, and the concatenated `book.html` that feeds the PDF
# build. When `also_build_pdf: true` the pdfify plugin captures
# book.html in memory at :pages, :post_render and drops it from
# site.pages at :site, :post_render, so `_site/book.html` is never
# written -- but offlinify's per-page hook fires for book.html
# before pdfify's removal, so the exclude pattern is what keeps it
# out of _site-offline/. When `also_build_pdf: false` book.html
# renders as a normal page on _site/ and the exclude does the same
# job from a different angle. The online _site/ keeps the metadata
# files; offlinify strips them from _site-offline/.
#
# Patterns are File.fnmatch-style with FNM_PATHNAME, matched against
# each file's path relative to the site root. `*` does NOT cross
# directory separators (so `*.bat` only catches top-level .bat
# files); use `**/*.bat` to catch them at any depth.
offline_exclude:
  - CNAME
  - robots.txt
  - sitemap.xml
  - book.html

# Excludes for both the build (Jekyll won't try to process these as
# source) and the watcher (`jekyll serve` won't trigger a rebuild
# when these change). Jekyll already excludes site.destination
# (_site/) automatically; we add _site-offline/ here so the
# Offlinify plugin's writes don't kick the watcher into an infinite
# rebuild loop. Keep this in sync with also_build_offline above.
exclude:
  - _site-offline
  - _site-pdf
  - _profile
  - redirects.json
  - "*.bat"
