# Chapter manifest for the twinBASIC documentation PDF.
#
# `sections` is an ordered list of URL prefixes. The book.html iterator
# expands each prefix into every page in `site.pages` whose URL starts
# with it, sorted by URL. Each page's `<article class="page">` becomes
# a chapter; pagedjs-cli paginates the concatenated result.
#
# Index pages (URL ending in `/`) sort before sibling content pages
# under ASCII lexicographic order, which gives a natural
# "package landing → individual symbols" reading flow.

sections:
  - /tB/Core/
  - /tB/Modules/
  - /tB/Packages/VBRUN/
  - /tB/Packages/VB/
  - /tB/Packages/WebView2/
  - /tB/Packages/Assert/
  - /tB/Packages/CustomControls/
  - /tB/Packages/CEF/
  - /tB/Packages/WinEventLogLib/
  - /tB/Packages/WinNamedPipesLib/
  - /tB/Packages/WinServicesLib/
  - /tB/Packages/tbIDE/
  - /tB/Packages/WinNativeCommonCtls/
