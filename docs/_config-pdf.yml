# Layered on top of _config.yml when building the PDF source:
#   bundle exec jekyll build --config _config.yml,_config-pdf.yml
#
# Produces _site-pdf/ containing every page rendered through _layouts/book.html
# (minimal HTML, no sidebar / nav / footer chrome). The output is the source
# tree that the concatenation step + pagedjs-cli operate on.

destination: _site-pdf

# Jekyll replaces top-level array keys when configs are layered, so the entire
# defaults: list has to be restated here, not just the layout entry we want to
# change.
defaults:
  - scope:
      path: ""
    values:
      layout: book
  - scope:
      path: "*/Images"
    values:
      image: true
  - scope:
      path: "assets/css"
    values:
      render_with_liquid: true
