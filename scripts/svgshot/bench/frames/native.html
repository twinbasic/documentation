<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>A document with the platform's scrollbar</title>
<!--
  No scrollbar style: the frame's viewport scrollbar is Windows' own, drawn from
  the document's scroll offset and size (paintNativeScrollbars).
-->
<style>
body { margin: 0; padding: 8px; background: #fff; color: #111; font: 13px "Segoe UI", sans-serif; }
.row { height: 22px; border-bottom: 1px solid #ccc; }
</style>
<body>
<script>
  for (let i = 0; i < 30; i++) document.body.insertAdjacentHTML("beforeend", `<div class="row">line ${i}</div>`);
  window.scrollTo(0, 60);
</script>
</body>
</html>
