<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>A plain frame</title>
<style>
html { overflow: hidden; }
body { margin: 0; padding: 8px; background: #fffbe6; color: #222; font: 13px "Segoe UI", sans-serif; }
h1 { margin: 0 0 6px; font-size: 18px; }
.box { margin-top: 8px; padding: 4px 6px; border: 1px solid #b80; border-radius: 4px; background: #fff3c0; }
a { color: #05c; text-decoration: underline; }
</style>
<body>
<h1>Plain frame</h1>
<p>Text in a frame, with <a href="#">a link</a> and <b>bold</b> words, wrapped at the width of the frame.</p>
<div class="box">A bordered box</div>
</body>
</html>
