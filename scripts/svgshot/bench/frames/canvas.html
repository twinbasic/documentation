<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>A background that is the frame's canvas</title>
<!--
  The body's background, with none on the root element, is the canvas of the
  frame: it fills the whole frame, past the end of the short content.
-->
<style>
body { margin: 0; padding: 8px; background: #20404a; color: #eee; font: 13px "Segoe UI", sans-serif; }
</style>
<body>
<p>Short content over a background that fills the frame.</p>
</body>
</html>
