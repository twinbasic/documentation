# The gate steps both workflows run, in their order, after the build.
#
# checks.yml runs them on every pull request, before a merge; tbdocs-gh-pages.yml
# runs them on every push to `staging`, before it deploys -- which makes that
# the one place a change pushed straight to `staging`, or a manual dispatch,
# meets them. One list serves both, so a gate cannot be added to one workflow
# and forgotten in the other; scripts/check_ci_workflows.mjs checks this list
# against test.bat and check.bat. Each gate is its own step, shown as its own
# group in the job's log.
#
# Needs the repository checked out, dependencies installed, Chromium
# installed, and the site built into docs/_site*, as both workflows do before
# calling it.
name: Run the gates
description: The gate steps both workflows share, checked against test.bat and check.bat by check_ci_workflows.mjs.
runs:
  using: composite
  steps:
    # The build is the only pass over the site's HTML. This step is NOT a
    # second one: it runs the differential harness against a nine-file
    # synthetic tree that carries one fault of every kind, so
    # scripts/check_links.mjs -- still the tool for a tree the build did not
    # produce, and the oracle the fused path is defined against -- cannot rot
    # unnoticed. ~0.3 s, no site files touched.
    #
    # The full script-vs-fused comparison over the real trees stays a manual
    # gate (`check_links_diff.mjs --a script --b fused`): running it here would
    # mean checking every page twice, which is exactly what folding the check
    # into the build removed.
    - name: Verify the standalone link checker (check_links_diff.mjs)
      shell: bash
      run: node scripts/check_links_diff.mjs --case fixture --a script --b index
    # The publish allowlist (builder/publish-policy.mjs) is enforced inside
    # the build, so a green build already says nothing unpublishable is in
    # docs/. It does NOT say the allowlist still refuses anything: one widened
    # to refuse nothing reports the same clean pass. This asserts the
    # refusals against named probes -- a stray .bak, a .pem, a scratch .md
    # with no frontmatter. No browser, no built tree, ~40 ms.
    - name: Verify the publish allowlist (check_publish_policy.mjs)
      shell: bash
      run: node scripts/check_publish_policy.mjs
    # The two gate lists on Tools.md against the wrappers that run them, plus
    # every gate count stated in prose in README.md or under
    # docs/Documentation/. A stale gate count breaks no link and fails no other
    # gate, so nothing else notices it. Pure text, ~50 ms.
    - name: Verify the documented gate lists (check_gate_lists.mjs)
      shell: bash
      run: node scripts/check_gate_lists.mjs
    # Both workflows, and this action, against the wrappers: every gate
    # test.bat and check.bat run, with the same arguments and in the same
    # order, and a build with build.bat's flags. See the script's header for
    # the differences it allows. No browser, no built tree.
    - name: Verify the workflows run the wrappers' gates (check_ci_workflows.mjs)
      shell: bash
      run: node scripts/check_ci_workflows.mjs
    # Biome, pinned, over the tooling, with the rules that find defects and
    # none about style (biome.jsonc). Moving and deleting code leaves unused
    # imports and undeclared names behind, and nothing else reads the tooling
    # for them. Warnings fail as well as errors, since Biome reports an unused
    # import as a warning and exits 0 on one; and a scope that matches no
    # script fails rather than passing. npm ci installs the Linux binary. No
    # browser, no built tree, ~0.25 s.
    - name: Lint the tooling (check_lint.mjs)
      shell: bash
      run: node scripts/check_lint.mjs
    # Unit tests for the site search, run by Node's own test runner: what the
    # entries builder/search.mjs writes hold, which the build's check does not
    # read, and guards that the online client, the offline client and
    # eval/site_search.mjs's replica still agree. No browser, no built tree,
    # well under a second.
    - name: Unit-test the site search (test/search.test.mjs)
      shell: bash
      run: node --test test/search.test.mjs
    # Unit tests for builder/render.mjs's markdown-it plugins, on inputs the
    # corpus does not hold: the build compares whole pages, so a plugin that
    # is wrong only on such input passes it. No browser, no built tree.
    - name: Unit-test the markdown plugins (test/render.test.mjs)
      shell: bash
      run: node --test test/render.test.mjs
    # Unit tests for builder/strftime.mjs, the footer's date formatter, which
    # no build calls today because no page sets a date for it.
    - name: Unit-test the date formatter (test/strftime.test.mjs)
      shell: bash
      run: node --test test/strftime.test.mjs
    # check_examples.mjs's probes: batching, crash isolation through a fake
    # lane, the canaries and the fence classifier. check_examples.mjs needs a
    # twinBASIC install, which CI has not; its probes need none.
    - name: Unit-test check_examples' batches (test/example-batches.test.mjs)
      shell: bash
      run: node --test test/example-batches.test.mjs
    # A regex that backtracks exponentially does not fail a build, it stops
    # one: the corpus passes until a page happens to contain the trigger, and
    # then a render worker sits inside String.replace forever. Nothing else
    # here can see it, because there is nothing to see until the content
    # changes.
    #
    # Reads regex literals AND every `new RegExp(...)` the source decides the
    # arguments of. That second half is not a refinement: assembling a pattern
    # from shared string constants is ordinary JavaScript, and a gate that
    # read literals only would be blind to it.
    #
    # Gates on exponential only -- about a fifth of the patterns here are
    # polynomial, nearly all the ordinary `<tag[^>]*>` shape on bounded input,
    # and a gate that fails on day one gets switched off. The self-test probes
    # run inside the same pass, classification and folding both, so a green
    # line here cannot be a gate that has stopped detecting. No browser, no
    # built tree, a few seconds sharded across the runner's CPUs.
    #
    # recheck's native backend is an optional dependency resolved per
    # platform; if it is missing the script says so and falls back to the
    # pure-JS implementation, which is slower but reaches the same verdict on
    # every probe.
    - name: Verify regex safety (check_regex_safety.mjs)
      shell: bash
      run: node scripts/check_regex_safety.mjs
    # render.mjs applies several kramdown-parity rewrites to RAW markdown,
    # before anything has been parsed, so none of them can tell prose from
    # code -- on a site whose subject matter is code. Such a rewrite can strip
    # `{% raw %}` inside fences, lose the indentation of the code in an
    # admonition body, percent-encode `Items[1](a, b)` inside a fence, or
    # delete a YAML sample's closing `---` and promote the line above it to a
    # heading.
    #
    # No other gate can see any of it: the corruption is inside <code>, and
    # the link, integrity, publish and axe checks all pass over it. Tokenise
    # the source, apply the real rewrite chain, re-tokenise, and compare the
    # literal regions. Probes ride along in the same run so a clean corpus
    # cannot be mistaken for a working gate. No browser, no built tree.
    - name: Verify code regions survive the pre-render rewrites (check_code_regions.mjs)
      shell: bash
      run: node scripts/check_code_regions.mjs
    # The page-count drift guard reports nothing on a healthy tree, so a green
    # build says exactly what a guard that had stopped working says. These
    # probes make the other assertion, against a scratch baseline rather than
    # the committed one. The first replays a whole package lost to a blanket
    # exclude rule, which a guard that knows only a floor cannot see. No
    # browser, no built tree.
    - name: Verify the page-count drift guard (check_page_baseline.mjs)
      shell: bash
      run: node scripts/check_page_baseline.mjs
    # The book-coverage warnings say nothing when every page has an entry in
    # docs/_book.yml, which is also all a check that had stopped working would
    # say. Without the warnings, whole sections drop out of the PDF without a
    # word. These probes give each of the five findings a fault to report, on
    # a manifest and pages built in memory. No browser, no built tree.
    - name: Verify the book-coverage warnings (check_book_coverage.mjs)
      shell: bash
      run: node scripts/check_book_coverage.mjs
    # The symbol index (tB/symbols.json) is read by the IDE help add-in. A
    # build that indexes the reference cleanly says nothing about the rules
    # that did not fire on it, so these probes assert each against the case
    # that made it necessary -- the .twin scanner's traps, the rules placing a
    # symbol on a page or heading, and the drift guard refusing a URL the index
    # stopped publishing. Fixtures only: no tree, no install.
    - name: Verify the symbol index and its drift guard (check_symbol_index.mjs)
      shell: bash
      run: node scripts/check_symbol_index.mjs
    # The scanners of twinBASIC source and of Attributes.md misread in
    # silence: a line read as the wrong kind is counted, generated or skipped
    # as that kind. These probes run the shared modifier list through all
    # three scanners, and assert the census's declaration kinds and the probe
    # generator's targets against the shapes each can get wrong. Fixed
    # inputs only: no tree, no install.
    - name: Verify the twinBASIC source and attribute scanners (check_twin_parsers.mjs)
      shell: bash
      run: node scripts/check_twin_parsers.mjs
    # The attribute sweep asks the compiler where every attribute is legal, and
    # none of its failures announces itself: a wrong site skeleton reads as
    # "every attribute is refused here", an ignored control as a recognised
    # attribute, a refusal taken for an acceptance as a finding about the
    # compiler. The IDE is what cannot run here, so the parts that decide what
    # an answer means are probed on fixed inputs: no IDE, no tree, no install.
    - name: Verify the attribute sweep's logic (check_attribute_sweep.mjs)
      shell: bash
      run: node scripts/check_attribute_sweep.mjs
    # Nothing else tests how a tool reads its command line, which is how a
    # value flag given no value can be read as NaN or as the next flag.
    # lib/cli.mjs's probes, then each tool's recorded command-line errors, each
    # run with a twinBASIC IDE and a browser that do not exist, so a case that
    # gets past its command line fails rather than starting either. No
    # browser, no built tree, no install.
    - name: Verify the command-line parser and the tools' cases (check_cli.mjs)
      shell: bash
      run: node scripts/check_cli.mjs
    # The book's pdf-lib shims replace pdf-lib's parser, object classes and
    # writer, and nothing else compares what they write with what pdf-lib
    # writes. This saves one document with each, in child processes, and
    # compares the two object by object with streams inflated; a shim that
    # never runs fails it too. No browser, no built tree.
    - name: Verify the book's pdf-lib shims against stock (check_pdf_shims_equiv.mjs)
      shell: bash
      run: node scripts/check_pdf_shims_equiv.mjs
    # impexp.mjs and impexp.py are one published tool in two languages, and
    # Tools.md promises the same output and the same bytes. Both built-in test
    # suites, then one sequence of commands through each edition, comparing
    # exit codes, output and written files. The runner's own python3 serves;
    # without one the gate fails here, because GitHub sets CI=true, where
    # test.bat on a machine without Python reports it skipped.
    - name: Verify the two impexp editions agree (check_impexp_parity.mjs)
      shell: bash
      run: node scripts/check_impexp_parity.mjs
    # Graphviz sizes each node box from a width table; the browser paints the
    # label with a real font. Nothing in the build compares the two, so a
    # mismatch ships as text hanging outside its box on a green build -- which
    # is how 27 labels across three diagrams went out, through a full
    # accessibility sweep, unreported. axe does not evaluate SVG <text>
    # geometry either.
    #
    # After the build on purpose: builder/dot.mjs rewrites a stale .svg from
    # its .dot in place, so this measures the bytes about to be deployed, not
    # the ones that were committed. It loads Inter from the committed .woff2 by
    # @font-face rather than relying on an installed face, so unlike the
    # target-size rules it measures the same here as on a dev box. ~1 s.
    - name: Verify DOT diagram fit (check_dot_fit.mjs)
      shell: bash
      run: node scripts/check_dot_fit.mjs
    # check_a11y.mjs injects a PATCHED axe bundle (plain-color-fields, -26 % on
    # a realistic page set -- see builder/PLAN-axe-perf.md), so the patch has
    # to be verified before its results are trusted. The patch asserts its
    # substitution targets and so fails loudly if an axe-core bump moves the
    # code; this catches the other case, where the text still matches but the
    # colour maths has changed. The fingerprint gate cannot see that -- it
    # compares `incomplete` as a rule-id set.
    #
    # Cheap (one page, two bundles), and Chromium is already installed. The
    # change that bumps axe-core is exactly when it earns its place.
    - name: Verify axe source patch (check_axe_patch_equiv.mjs)
      shell: bash
      run: node scripts/check_axe_patch_equiv.mjs
    # The scan is thirteen pages of ~1,160, so its page list decides what it
    # can report at all. This fails when the site grows a markup construct no
    # sample page carries -- the drift that let the previous six-page sample
    # report a clean pass while 54 pages had violations in constructs it never
    # saw. No browser, ~1 s.
    - name: Verify a11y sample coverage (pick_a11y_sample.mjs)
      shell: bash
      run: node scripts/pick_a11y_sample.mjs --check
    # Matches check.bat: the build's own link check gates this, and a link
    # failure short-circuits before the (slower) browser scan runs. Scans
    # _site-offline/, whose relative asset paths actually resolve -- _site/
    # uses root-absolute URLs that render unstyled here, making every
    # colour-contrast result meaningless.
    - name: Accessibility check (check_a11y.mjs)
      shell: bash
      run: node scripts/check_a11y.mjs
